<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>自动跳转页面</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
      background: #f4f5f7;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 26px 8px;
    }

    h1 {
      margin: 0 0 30px;
      font-size: clamp(42px, 11vw, 62px);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    p {
      margin: 0;
      color: #1f2933;
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.45;
      font-weight: 500;
    }

    strong {
      font-weight: 900;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin: 34px auto 0;
      width: min(100%, 600px);
    }

    a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 88px;
      padding: 20px 18px;
      border-radius: 14px;
      background: #075fb4;
      color: #ffffff;
      font-size: clamp(21px, 4.8vw, 30px);
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(7, 95, 180, 0.16);
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, background .15s ease;
    }

    a:active {
      transform: scale(.985);
      background: #054f96;
    }

    .note {
      margin-top: 28px;
      color: #6b7280;
      font-size: 15px;
      line-height: 1.7;
    }

    @media (max-width: 520px) {
      body {
        align-items: flex-start;
        padding-top: 22vh;
      }

      main {
        padding: 0;
      }

      h1 {
        margin-bottom: 28px;
      }

      .actions {
        gap: 14px;
        margin-top: 28px;
      }

      a {
        min-height: 58px;
        border-radius: 8px;
        padding: 12px 8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>自动跳转页面</h1>
    <p>若有弹出窗口，须点击 <strong>【允许】</strong></p>

    <div class="actions">
      <a id="open" href="#">点击一键安装</a>
      <a id="direct" href="#">访问直达链接</a>
    </div>

    <div class="note">如果没有自动跳转，请点击上方按钮。</div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const fallback = "https://grandpaniuu.github.io/GrandpaNiu/import.html";
    const target = params.get("url") || fallback;
    const open = document.getElementById("open");
    const direct = document.getElementById("direct");

    open.href = target;
    direct.href = target;

    setTimeout(function () {
      location.href = target;
    }, 1200);
  </script>
</body>
</html>
