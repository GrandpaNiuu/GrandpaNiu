<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>安装模块</title>
  <style>
    :root {
      --bg-0: #070b12;
      --bg-1: #0d1320;
      --card: rgba(17, 25, 40, 0.82);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #a7b0c0;
      --muted-2: #7d8797;
      --green: #18a058;
      --green-2: #118347;
      --blue: #4f8cff;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 18% 18%, rgba(79, 140, 255, 0.24), transparent 30%),
        radial-gradient(circle at 82% 26%, rgba(24, 160, 88, 0.18), transparent 28%),
        linear-gradient(145deg, var(--bg-0), var(--bg-1) 62%, #05070c);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
    }

    main {
      position: relative;
      width: min(100%, 520px);
      padding: 34px 24px 26px;
      overflow: hidden;
      text-align: center;
      border: 1px solid var(--card-border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(20, 30, 48, 0.9), rgba(10, 16, 28, 0.9));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), transparent 38%);
    }

    .badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: #dbe7ff;
      background: rgba(255, 255, 255, 0.06);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin: 22px auto 16px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(24, 160, 88, 0.22), rgba(79, 140, 255, 0.18));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 18px 36px rgba(0, 0, 0, 0.28);
      font-size: 32px;
    }

    h1 {
      position: relative;
      margin: 0;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.12;
      letter-spacing: -0.04em;
    }

    .subtitle {
      position: relative;
      max-width: 380px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .tips {
      position: relative;
      display: grid;
      gap: 9px;
      margin: 24px 0 0;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.045);
      text-align: left;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .tip {
      display: flex;
      gap: 9px;
      align-items: flex-start;
    }

    .dot {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      border-radius: 50%;
      background: rgba(24, 160, 88, 0.18);
      color: #66e39d;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
    }

    .actions {
      position: relative;
      display: grid;
      gap: 12px;
      margin-top: 26px;
    }

    a {
      -webkit-tap-highlight-color: transparent;
    }

    .primary {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 16px 20px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--green), var(--green-2));
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 14px 34px rgba(24, 160, 88, 0.28);
    }

    .secondary {
      color: var(--muted-2);
      font-size: 13px;
      text-decoration: none;
    }

    .footer {
      position: relative;
      margin-top: 18px;
      color: rgba(167, 176, 192, 0.72);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (prefers-color-scheme: light) {
      body {
        background:
          radial-gradient(circle at 18% 18%, rgba(79, 140, 255, 0.16), transparent 30%),
          radial-gradient(circle at 82% 26%, rgba(24, 160, 88, 0.16), transparent 28%),
          #f5f7fb;
        color: #111827;
      }

      main {
        background: rgba(255, 255, 255, 0.88);
        border-color: rgba(15, 23, 42, 0.08);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
      }

      .badge,
      .tips {
        background: rgba(15, 23, 42, 0.04);
        border-color: rgba(15, 23, 42, 0.08);
      }

      .badge {
        color: #1f2937;
      }

      .subtitle,
      .tips {
        color: #4b5563;
      }

      .footer,
      .secondary {
        color: #6b7280;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">GrandpaNiu · Fusion Module</div>
    <div class="icon">🐮</div>
    <h1>正在打开模块安装</h1>
    <p class="subtitle">如果弹出系统提示，请点击「允许」。如果没有自动跳转，请点击下面按钮。</p>

    <div class="tips" aria-label="安装提示">
      <div class="tip"><span class="dot">1</span><span>点击「允许」后，会尝试打开 Shadowrocket 或兼容客户端。</span></div>
      <div class="tip"><span class="dot">2</span><span>安装完成后，请在客户端内更新模块、脚本和资源。</span></div>
    </div>

    <div class="actions">
      <a id="open" class="primary" href="#">安装模块</a>
      <a id="direct" class="secondary" href="#">复制或访问直达链接</a>
    </div>

    <div class="footer">页面只负责跳转安装，不会收集任何个人信息。</div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const fallback = "https://grandpaniuu.github.io/GrandpaNiu/import.html";
    const target = params.get("url") || fallback;
    const open = document.getElementById("open");
    const direct = document.getElementById("direct");

    open.href = target;
    direct.href = target;

    setTimeout(function () {
      location.href = target;
    }, 350);
  </script>
</body>
</html>
