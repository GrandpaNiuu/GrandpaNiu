# Stable build profile

[profile]
name = stable
description = Low-risk source-driven build. Keep the current module body while allowing Rules, Scripts and Remotes to participate as first-class inputs.

[include]
sources = true
rules = true
scripts = true
remotes = true
source_rule_compat = true
source_script_compat = true

[rules]
direct = Rules/direct.list
spotify_direct = Rules/spotify-direct.list
youtube_direct = Rules/youtube-direct.list
reject = Rules/reject.list
app_clean = Rules/app-clean.list
web_ads = Rules/web-ads.list

[scripts]
spotify = Scripts/spotify.conf
youtube = Scripts/youtube.conf
app_clean = Scripts/app-clean.conf

[safety]
keep_spotify = true
keep_youtube = true
allow_auto_delete = false
prefer_comment_before_delete = true
write_release_only = true
