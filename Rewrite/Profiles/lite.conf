# Lite low-power build profile

[profile]
name = lite
description = Low-power reference profile. Keeps Spotify, YouTube, Zhihu enhanced cleaner and essential local rules while reducing ordinary App scripts and compatibility bulk.

[include]
sources = true
rules = true
scripts = true
remotes = true
source_rule_compat = false
source_script_compat = false

[rules]
direct = Rules/direct.list
spotify_direct = Rules/spotify-direct.list
youtube_direct = Rules/youtube-direct.list
reject = Rules/reject.list
web_ads = Rules/web-ads.list

[scripts]
spotify = Scripts/spotify.conf
youtube = Scripts/youtube.conf
zhihu_enhance = Scripts/zhihu-enhance.conf

[mitm]
core = Rewrite/Sources/MITM-core.conf

[safety]
keep_spotify = true
keep_youtube = true
keep_zhihu = true
allow_auto_delete = false
prefer_comment_before_delete = true
