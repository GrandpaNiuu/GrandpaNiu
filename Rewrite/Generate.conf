# GrandpaNiu module factory generation plan
# Source files are editable inputs. Release files are generated outputs.

[profile]
active = fusion
file = Rewrite/Profiles/fusion.conf

[include]
meta = Rewrite/Sources/Meta.conf
rule = Rewrite/Sources/Rule.conf
url_rewrite = Rewrite/Sources/URL-Rewrite.conf
header_rewrite = Rewrite/Sources/Header-Rewrite.conf
body_rewrite = Rewrite/Sources/Body-Rewrite.conf
map_local = Rewrite/Sources/Map-Local.conf
script = Rewrite/Sources/Script.conf
mitm = Rewrite/Sources/MITM.conf

[rules]
direct = Rules/direct.list
reject = Rules/reject.list
app_clean = Rules/app-clean.list
web_ads = Rules/web-ads.list
spotify_direct = Rules/spotify-direct.list
youtube_direct = Rules/youtube-direct.list

[scripts]
spotify = Scripts/spotify.conf
youtube = Scripts/youtube.conf
app_clean = Scripts/app-clean.conf

[remotes]
index = Rewrite/Remotes/Index.md
sources = Rewrite/Remotes/sources.json
candidates = Rewrite/Remotes/candidates.json

[output]
main = Ronghemokuai.sgmodule
release = Release/Ronghemokuai.sgmodule
rules = Release/Rules.conf
rules_group = Release/RulesGroup.conf
modules_dir = Release/Modules
app_sources_dir = Rewrite/Sources/Apps
android_dir = Release/Android
include_empty_modules = false

[builder]
entry = Rewrite/Generator/Builder.py
build_script = scripts/build_module.py
finalize_script = scripts/factory_finalize.py
release_report_script = scripts/build_release_variants.py
release_rules_script = scripts/build_release_rules.py
release_modules_script = scripts/build_release_modules.py
release_android_script = scripts/build_release_android.py
web_catalog_script = scripts/build_web_catalog.py

[checks]
validate_remote_rules = scripts/validate_remote_rule_syntax.py
validate_repository = scripts/validate_repository.py
validate_profiles = scripts/validate_profiles.py
validate_governance = scripts/validate_governance_extensions.py
traceability_required = true
dedupe = true
validate_syntax = true
prefer_comment_before_delete = true
allow_auto_delete = false

[release_modules]
spotify = GrandpaNiu Spotify | spotify, spclient, scdn.co, pscdn.co
youtube = GrandpaNiu YouTube | youtube, youtu.be, googlevideo, ytimg, maasea
zhihu = GrandpaNiu Zhihu | zhihu, zhihu-enhance
bilibili = GrandpaNiu Bilibili | bilibili, biliapi, biliapi.net, biliapi.com, bilivideo, hdslb
rednote = GrandpaNiu RedNote | xiaohongshu, xhslink, rednote, xiaohongshu.com
wechat = GrandpaNiu WeChat | weixin, wechat, servicewechat, wx.qq.com, wechatpay
qqnews = GrandpaNiu QQ News | qqnews, inews.qq.com, news.qq.com
weibo = GrandpaNiu Weibo | weibo, weibo.cn, weibo.com

[safety]
keep_spotify = true
keep_youtube = true
protect_login = true
protect_video_playback = true
