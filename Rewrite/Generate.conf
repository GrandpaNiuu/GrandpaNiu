# GrandpaNiu module factory generation plan
# Legacy-compatible copy. The preferred entry is Rewrite/Generator/Generate.conf.
# Source files are editable inputs. Release files are generated outputs.

[profile]
active = fusion
file = Rewrite/Profiles/fusion.conf

[include]
meta = Rewrite/Sources/Meta.conf
rule = Rewrite/Sources/Rule.conf
url_rewrite = Rewrite/Sources/URL-Rewrite.conf
header_rewrite = Rewrite/Sources/Header-Rewrite.conf
body_rewrite = Rewrite/Sources/Body-Rewrite.conf
map_local = Rewrite/Sources/Map-Local.conf
script = Rewrite/Sources/Script.conf
mitm = Rewrite/Sources/MITM.conf

[rules]
direct = Rules/direct.list
reject = Rules/reject.list
app_clean = Rules/app-clean.list
web_ads = Rules/web-ads.list
youtube_direct = Rules/youtube-direct.list

[scripts]
spotify = Scripts/spotify.conf
youtube = Scripts/youtube.conf
app_clean = Scripts/app-clean.conf

[remotes]
index = Rewrite/Remotes/Index.md
sources = Rewrite/Remotes/sources.json
candidates = Rewrite/Remotes/candidates.json

[misc_sources]
generic_ads = Rewrite/Sources/Misc/generic-ads.conf
httpdns = Rewrite/Sources/Misc/httpdns.conf
analytics = Rewrite/Sources/Misc/analytics.conf
cdn_direct = Rewrite/Sources/Misc/cdn-direct.conf
finance_protect = Rewrite/Sources/Misc/finance-protect.conf
video_protect = Rewrite/Sources/Misc/video-protect.conf

[app_sources]
dir = Rewrite/Sources/Apps
template = Rewrite/Sources/Apps/_TEMPLATE.conf

[output]
main = Ronghemokuai.sgmodule
release = Release/Ronghemokuai.sgmodule
alias = Release/Module.sgmodule
rules = Release/Rules.conf
rules_group = Release/RulesGroup.conf
modules_dir = Release/Modules
app_sources_dir = Rewrite/Sources/Apps
android_dir = Release/Android
web_modules = Web/modules.html
checksums_json = Release/checksums.json
checksums_txt = Release/checksums.txt
build_summary_json = reports/build_summary.json
build_summary_md = reports/build_summary.md
include_empty_modules = false

[builder]
entry = Rewrite/Generator/Builder.py
build_script = scripts/build_module.py
finalize_script = scripts/factory_finalize.py
release_report_script = scripts/build_release_variants.py
release_rules_script = scripts/build_release_rules.py
release_modules_script = scripts/build_release_modules.py
release_aliases_script = scripts/build_release_aliases.py
release_channels_script = scripts/build_channels.py
android_rules_script = scripts/build_android_rules.py
windows_v2rayn_script = scripts/build_windows_v2rayn.py
release_checksums_script = scripts/build_checksums.py
release_summary_script = scripts/build_release_summary.py
release_android_script = scripts/build_release_android.py
web_catalog_script = scripts/build_web_catalog.py
web_modules_script = scripts/build_web_modules.py

[checks]
validate_app_sources = scripts/validate_app_sources.py
validate_manifest = scripts/validate_manifest.py
validate_remote_rules = scripts/validate_remote_rule_syntax.py
generate_automation_gap = tools/generate_automation_gap_report.py
validate_repository = scripts/validate_repository.py
validate_profiles = scripts/validate_profiles.py
validate_script_aggregation = tools/validate_script_aggregation.py
test_script_bundle_sandbox = tools/test_script_bundle_sandbox.py
validate_upstream_risk_gate = tools/validate_upstream_risk_gate.py
generate_mitm_scope = tools/generate_mitm_scope_report.py
generate_rule_overlap = tools/generate_rule_overlap_report.py
generate_app_cleaner_active = tools/generate_app_cleaner_active_report.py
validate_governance = scripts/validate_governance_extensions.py
android_format_check = scripts/android_format_check.py
traceability_required = true
dedupe = true
validate_syntax = true
prefer_comment_before_delete = true
allow_auto_delete = false

[release_modules]
spotify = GrandpaNiu Spotify | spotify, spclient, scdn.co, pscdn.co
youtube = GrandpaNiu YouTube | youtube, youtu.be, googlevideo, ytimg, maasea
zhihu = GrandpaNiu Zhihu | zhihu, zhihu-enhance
bilibili = GrandpaNiu Bilibili | bilibili, biliapi, biliapi.net, biliapi.com, bilivideo, hdslb
rednote = GrandpaNiu RedNote | xiaohongshu, xhslink, rednote, xiaohongshu.com
wechat = GrandpaNiu WeChat | weixin, wechat, servicewechat, wx.qq.com, wechatpay
qqnews = GrandpaNiu QQ News | qqnews, inews.qq.com, news.qq.com
weibo = GrandpaNiu Weibo | weibo, weibo.cn, weibo.com
pinduoduo = GrandpaNiu Pinduoduo | pinduoduo, yangkeduo, pddpic, pddcdn
jd = GrandpaNiu JD | jd.com, jdimg, 360buyimg
taobao = GrandpaNiu Taobao | taobao, tmall, alicdn, tbcdn, taobaocdn, mmstat
netease-music = GrandpaNiu Netease Music | music.163.com, music.126.net, netease
mgtv = GrandpaNiu MGTV | mgtv, bz.mgtv.com
huya = GrandpaNiu Huya | huya, msstatic
yiche = GrandpaNiu Yiche | yiche
pcauto = GrandpaNiu PCAuto | pcauto, pconline
umetrip = GrandpaNiu Umetrip | umetrip, variflight
xiaopeng = GrandpaNiu Xiaopeng | xiaopeng

[channels]
stable = Release/Stable | true | Production channel copied from the current Fusion release.
beta = Release/Beta | false | Reserved channel for less conservative builds.
canary = Release/Canary | false | Reserved channel for high-risk experimental builds.

[safety]
keep_spotify = true
keep_youtube = true
protect_login = true
protect_video_playback = true
