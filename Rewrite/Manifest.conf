# GrandpaNiu Rewrite Manifest
# This file is the visible factory manifest for source -> release generation.
# It does not replace scripts/build_module.py; it documents and organizes the module factory layers.

[module]
name = GrandpaNiu Fusion
public_name = 融合模块
source_root = Rewrite
main_output = Ronghemokuai.sgmodule
release_output = Release/Ronghemokuai.sgmodule
release_alias = Release/Module.sgmodule
update_url = https://grandpaniuu.github.io/GrandpaNiu/Ronghemokuai.sgmodule
profile = Rewrite/Profiles/fusion.conf

[generator]
entry = Rewrite/Generator/Builder.py
plan = Rewrite/Generator/Generate.conf
legacy_plan = Rewrite/Generate.conf
builder = scripts/build_module.py
finalizer = scripts/factory_finalize.py
release_variants = scripts/build_release_variants.py
release_rules = scripts/build_release_rules.py
release_modules = scripts/build_release_modules.py
release_aliases = scripts/build_release_aliases.py
web_catalog = scripts/build_web_catalog.py
web_modules = scripts/build_web_modules.py
manifest_validator = scripts/validate_manifest.py

[sections]
meta = Rewrite/Sources/Meta.conf
rule = Rewrite/Sources/Rule.conf
url_rewrite = Rewrite/Sources/URL-Rewrite.conf
header_rewrite = Rewrite/Sources/Header-Rewrite.conf
body_rewrite = Rewrite/Sources/Body-Rewrite.conf
map_local = Rewrite/Sources/Map-Local.conf
script = Rewrite/Sources/Script.conf
mitm = Rewrite/Sources/MITM.conf

[rules]
direct = Rules/direct.list
spotify_direct = Rules/spotify-direct.list
youtube_direct = Rules/youtube-direct.list
reject = Rules/reject.list
app_clean = Rules/app-clean.list
web_ads = Rules/web-ads.list
legacy_stable_import = Rules/legacy-stable-import.list
original_remote_rule_sets = Rules/original-remote-rule-sets.list
qingrex_miniapp = Rules/qingrex-miniapp-app-ad.list
wechat_ad_test = Rules/wechat-ad.list
app2smile_qqnews = Rules/app2smile-qqnews-stable-plus.list
aggressive_ad_sources = Rules/aggressive-ad-sources.list

[scripts]
spotify = Scripts/spotify.conf
youtube = Scripts/youtube.conf
app_clean = Scripts/app-clean.conf
app_cleaner_active = Scripts/app-cleaner-active.conf
zhihu_enhance = Scripts/zhihu-enhance.conf
legacy_reviewed = Scripts/legacy-reviewed.conf
qingrex_miniapp = Scripts/qingrex-miniapp-app-ad.conf
app2smile_qqnews = Scripts/app2smile-qqnews-stable-plus.conf

[url_rewrite]
legacy_reviewed = Rewrite/Sources/URL-Rewrite-legacy-reviewed.conf
qingrex_miniapp = Rewrite/Sources/URL-Rewrite-qingrex-miniapp-app-ad.conf

[header_rewrite]
legacy_reviewed = Rewrite/Sources/Header-Rewrite-legacy-reviewed.conf

[body_rewrite]
legacy_reviewed = Rewrite/Sources/Body-Rewrite-legacy-reviewed.conf
qingrex_miniapp = Rewrite/Sources/Body-Rewrite-qingrex-miniapp-app-ad.conf

[map_local]
legacy_reviewed = Rewrite/Sources/Map-Local-legacy-reviewed.conf
qingrex_miniapp = Rewrite/Sources/Map-Local-qingrex-miniapp-app-ad.conf

[mitm]
core = Rewrite/Sources/MITM-core.conf
app_clean = Rewrite/Sources/MITM-app-clean.conf
legacy_reviewed = Rewrite/Sources/MITM-legacy-reviewed.conf
qingrex_miniapp = Rewrite/Sources/MITM-qingrex-miniapp-app-ad.conf
stable_plus = Rewrite/Sources/MITM-stable-plus.conf
extended = Rewrite/Sources/MITM-extended.conf

[app_sources]
template = Rewrite/Sources/Apps/_TEMPLATE.conf
dir = Rewrite/Sources/Apps
spotify = Rewrite/Sources/Apps/spotify.conf
youtube = Rewrite/Sources/Apps/youtube.conf
zhihu = Rewrite/Sources/Apps/zhihu.conf
bilibili = Rewrite/Sources/Apps/bilibili.conf
rednote = Rewrite/Sources/Apps/rednote.conf
wechat = Rewrite/Sources/Apps/wechat.conf
weibo = Rewrite/Sources/Apps/weibo.conf
taobao = Rewrite/Sources/Apps/taobao.conf
jd = Rewrite/Sources/Apps/jd.conf
pinduoduo = Rewrite/Sources/Apps/pinduoduo.conf

[remote_sources]
index = Rewrite/Remotes/Index.md
registry = Rewrite/Remotes/sources.json
candidates = Rewrite/Remotes/candidates.json
catalog = Rewrite/Remotes/Catalog.md

[release]
main = Release/Ronghemokuai.sgmodule
alias = Release/Module.sgmodule
root_copy = Ronghemokuai.sgmodule
rules = Release/Rules.conf
rules_group = Release/RulesGroup.conf
modules_dir = Release/Modules
modules_index = Release/Modules/README.md
android_dir = Release/Android

[web]
index = Web/index.html
landing = import.html
redirect = redirect.html
android = android.html
modules = Web/modules.html
catalog = Web/catalog.md
registry = Web/registry.md
release_links = Web/release-links.json
remotes = Web/remotes.md

[registry]
file = Rewrite/Registry.md
release_modules_index = Release/Modules/README.md

[safety]
keep_spotify = true
keep_youtube = true
protect_login = true
protect_video_playback = true
allow_auto_delete = false
prefer_comment_before_delete = true
