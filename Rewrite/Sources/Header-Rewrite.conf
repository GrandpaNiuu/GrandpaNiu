# === New framework Layer 2.5: Header Rewrite ===
# Spotify app2smile upstream: remove if-none-match to avoid 304 cache on protobuf response handling.
# This source is merged into the final [Header Rewrite] section by scripts/build_module.py.
# It does not target login, payment, security, or account-auth endpoints.
http-request ^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ header-del if-none-match
