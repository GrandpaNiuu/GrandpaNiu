# === 新框架 Layer 2.5：Header Rewrite 层 ===
# Spotify now follows the Kelee upstream source; no app2smile header workaround is active.
# 本源头由 scripts/build_module.py 合并进最终 [Header Rewrite] 段。
# 当前不涉及登录、支付、安全接口或账号权益链路。
# Kelee upstream Spotify binary responses should not be served from stale 304 cache.
http-request ^https:\/\/(?:\w+-spclient|spclient\.wg)\.spotify\.com(?::443)?\/(?:bootstrap|user-customization-service) header-del if-none-match
