# === 新框架 Layer 2.5：Header Rewrite 层 ===
# Spotify app2smile 必要配置：删除 if-none-match，避免 304 缓存影响 spotify-proto 响应体处理。
# 本源头由 scripts/build_module.py 合并进最终 [Header Rewrite] 段。
# 当前不涉及登录、支付、安全接口或账号权益链路。
http-request ^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ header-del if-none-match
