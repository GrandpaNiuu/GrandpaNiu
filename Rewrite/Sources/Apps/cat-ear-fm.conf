#!name=GrandpaNiu 猫耳FM Source
#!desc=Auto-synced app-scoped source fragment
# auto-sync: true
# source-url: https://kelee.one/Tool/Loon/Lpx/CatEarFM_remove_ads.lpx
# upstream-name: 猫耳FM去广告
# risk: medium

[URL Rewrite]
^https://data\.missevan\.com/site/ad-track$ - reject-dict
^https://app\.missevan\.com/x/recommend/get-popup$ - reject-dict
^https://fm\.missevan\.com/api/v2/meta/banner$ - reject-dict
^https://fm\.missevan\.com/api/v2/recommended/top\? - reject-dict
^https://fm\.missevan\.com/api/v2/chatroom/sound/recommend\? - reject-dict

[Body Rewrite]
http-response-jq ^https://app\.missevan\.com/site/launch\? 'del(.info.splash,.info.splash_ready)'
http-response-jq ^https://app\.missevan\.com/site/config$ 'del(.info.tab_bar_live,.0,.info.enable_tab_bar_live_notice,.false,.info.teenager_popup_mode,.0)'
http-response-jq ^https://app\.missevan\.com/site/config$ 'del(.info.httpdns,.info.homepage_top_task_button)'
http-response-jq ^https://app\.missevan\.com/site/config$ '.info.cronet |= (fromjson | .quic=false | tojson)'
http-response-jq ^https://app\.missevan\.com/site/tabs\? '.info.tabs |= map(select(.title as $t | ["直播", "发现", "广播剧", "听书", "分类"] | index($t) != null))'
http-response-jq ^https://app\.missevan\.com/site/icons\? '.info.icons |= map(select(.title as $t | $t == "直播" or $t == "必听剧" or $t == "免费榜" or $t == "夜猫子" or $t == "启动音"))'
http-response-jq ^https://app\.missevan\.com/discovery/list$ '.info |= map(map(select(.title != "免流服务")))'
http-response-jq ^https://app\.missevan\.com/site/get-top$ 'del(.info.search_words)'

[MITM]
hostname = %APPEND% app.missevan.com,data.missevan.com,fm.missevan.com
