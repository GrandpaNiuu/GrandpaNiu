#!name=GrandpaNiu Bilibili Strong Source
#!desc=Strong Bilibili cleanup based on Sparkle; protobuf/gRPC enabled; video detail ads enhanced; use with caution.

# auto-sync: false

# source-url: https://github.com/kokoryh/Sparkle/blob/master/release/surge/module/bilibili.sgmodule

# upstream-name: Bilibili增强

# risk: high

# safety: Strong mode enables grpc.biliapi.net MITM and protobuf scripts. If Bilibili has no network, comments blank, or description blank, revert to the stable source.
[Rule]
# Bilibili native ad / commercial domains
DOMAIN,cm.bilibili.com,REJECT,pre-matching
DOMAIN,cm.bilibili.net,REJECT,pre-matching
DOMAIN,ad.bilibili.com,REJECT,pre-matching
DOMAIN,ad-game.bilibili.com,REJECT,pre-matching
DOMAIN,impression.biligame.com,REJECT,pre-matching
DOMAIN,adsrv.kurogames.com,REJECT,pre-matching
DOMAIN,mall.bilibili.com,REJECT,pre-matching
DOMAIN-SUFFIX,mall.bilibili.com,REJECT,pre-matching
DOMAIN-SUFFIX,ad.bilibili.com,REJECT,pre-matching
DOMAIN-KEYWORD,bili-ad,REJECT,pre-matching
DOMAIN-KEYWORD,biliad,REJECT,pre-matching
DOMAIN-KEYWORD,biligame-ad,REJECT,pre-matching
# Bilibili detail-page external promo / Pinduoduo chain
DOMAIN,at.pinduoduo.com,REJECT,pre-matching
DOMAIN,abtk.pinduoduo.com,REJECT,pre-matching
DOMAIN-SUFFIX,pddpic.com,REJECT,pre-matching
DOMAIN-SUFFIX,636949.xyz,REJECT,pre-matching
DOMAIN-SUFFIX,ivenq.life,REJECT,pre-matching
# Bilibili detail-page external promo / Taobao-Tmall chain
DOMAIN,adashx.m.taobao.com,REJECT,pre-matching
DOMAIN,adash.m.taobao.com,REJECT,pre-matching
DOMAIN,amdc.m.taobao.com,REJECT,pre-matching
DOMAIN,accscdn.m.taobao.com,REJECT,pre-matching
DOMAIN,acs4baichuan.m.taobao.com,REJECT,pre-matching
DOMAIN,tunion-api.m.taobao.com,REJECT,pre-matching
DOMAIN-SUFFIX,alimama.com,REJECT,pre-matching
DOMAIN-SUFFIX,tanx.com,REJECT,pre-matching
DOMAIN-SUFFIX,mmstat.com,REJECT,pre-matching
DOMAIN-SUFFIX,ut.taobao.com,REJECT,pre-matching
# Bilibili chat tracker
AND,((DOMAIN-SUFFIX,chat.bilibili.com),(OR,((DOMAIN-KEYWORD,stun),(DOMAIN-KEYWORD,tracker)))),REJECT,pre-matching
[Header Rewrite]
# Disabled by default: authorization replacement requires a user-provided token and is not safe for the strong module.
[Map Local]
^https://(?:app|api).bilibili.com/x/v2/splash/ header="content-type: application/json; charset=utf-8|bili-status-code: 0" data-type=text data="{"code":0,"message":"0","ttl":1,"data":{"list":[],"show":[],"event_list":[],"max_time":0,"min_interval":31536000}}"
^https://(?:app|api).bilibili.com/x/(?:resource/(?:top/activity|patch/tab(?:/v2)?)|v2/search/square|vip/ads/materials|v2/ad/index)? header="content-type: application/json; charset=utf-8|bili-status-code: -404" data-type=text data="{"code":-404,"message":"-404","ttl":1,"data":null}"
^https://api.bilibili.com/pgc/activity/deliver/material/receive? header="content-type: application/json|bili-status-code: 0" data-type=text data="{"code":0,"data":{"closeType":"close_win","container":[],"showTime":""},"message":"success"}"
^https://api.live.bilibili.com/xlive/e-commerce-interface/v1/ecommerce-user/get_shopping_info? header="content-type: application/json" data-type=text data="{}"
^https://line3-h5-mobile-api.biligame.com/game/live/large_card_material? header="content-type: application/json" data-type=text data="{"code":0,"message":"success"}"
# gRPC small safe-empty responses
^https://grpc.biliapi.net/bilibili.app.interface.v1.Teenagers/ModeStatus$ header="content-type: application/grpc|grpc-status: 0" data-type=base64 data="AAAAABMKEQgCEgl0ZWVuYWdlcnMgAioA"
^https://grpc.biliapi.net/bilibili.app.interface.v1.Search/DefaultWords$ header="content-type: application/grpc|grpc-status: 0" data-type=base64 data="AAAAACEaHeaQnOe0ouinhumikeOAgeeVquWJp+aIlnVw5Li7KAE="
^https://grpc.biliapi.net/bilibili.app.(?:view.v1.View/TFInfo|viewunite.v1.View/(?:PlayPause|ViewEndPage))$ header="content-type: application/grpc|grpc-status: 0" data-type=base64 data="AAAAAAA="
[Body Rewrite]
http-response-jq ^https://api.bilibili.com/x/pd-proxy/tracker? '.data[][]?="stun.chat.bilibili.com:3478"'
http-response-jq ^https://api.bilibili.com/pgc/view/v2/app/season? 'del(.data.payment)'
http-response-jq ^https://api.bilibili.com/pgc/page/channel? '.data.modules |= map(select(.type != "TIP") | if .type == "BANNER" then .module_data.items |= map(select(.url | startswith("https://www.bilibili.com/blackboard/era/") | not)) else . end)'
http-response-jq ^https://api.bilibili.com/pgc/page/(?:bangumi|cinema/tab)? '.result.modules |= if . then map(if (.style | startswith("tip")) or (.module_id | IN(241, 1283, 1441, 1284)) then .items = [] elif .style | startswith("banner") then .items |= if . then map(select(.link | contains("play"))) else [] end elif .style | startswith("function") then .items |= if . then map(select(.blink | startswith("bilibili"))) else [] end end) end'
http-response-jq ^https://api.live.bilibili.com/xlive/(?:app-interface/v2/index/feed|app-room/v1/index/getInfoBy(?:Room|User))? '.data |= (del(.play_together_info, .play_together_info_v2, .activity_banner_info) | if .function_card then .function_card[] = null end | if .new_tab_info.outer_list then .new_tab_info.outer_list |= map(select(.biz_id != 33)) end | if .card_list then .card_list |= map(select(.card_type != "banner_v2")) end | reduce ([["show_reserve_status"], false], [["reserve_info", "show_reserve_status"], false], [["shopping_info", "is_show"], 0]) as [$path, $value] (.; if getpath($path) then setpath($path; $value) end))'
http-response-jq ^https://(?:app|api).bilibili.com/x/v2/view(?:/unite)?? '.data |= (del(.cm,.cms,.ad_info,.ad_dislike,.special_cell,.activity_url,.banner,.banners,.cm_config,.relate_cm,.ad_reply,.ad_resource,.ad_tag,.ad_args,.commercial_info,.commerce,.ecommerce,.shopping_info,.shopping_card,.goods_info,.goods_card,.recommend_ad,.operation_card,.activity_banner_info,.middle_ad,.bottom_ad,.pop_ad) | if .relates then .relates |= map(select(((.card_goto? // "") | test("ad|cm|banner|mall|shop|goods") | not) and ((.goto? // "") | test("ad|cm|banner|mall|shop|goods") | not) and (.ad_cb? == null) and (.cm_mark? == null) and (((.uri? // "") | test("cm\.bilibili|ad\.bilibili|mall\.bilibili|bilicm|ad_|shopping|ecommerce|taobao|tmall|pinduoduo|pdd")) | not))) else . end | if .cms then .cms = [] else . end)'
http-response-jq ^https://(?:app|api).bilibili.com/x/v2/feed/index(?:/story)?? '.data.items |= if . then map(select(((.card_goto? // "") | test("ad|cm|banner|mall|shop|goods") | not) and ((.goto? // "") | test("ad|cm|banner|mall|shop|goods") | not) and (.ad_info? == null) and (.ad_cb? == null) and (.cm_mark? == null))) else [] end'
[Script]
# Request-side protobuf cleanup: improves comment loading and removes pinned comment ads.
bilibili.request = type=http-request,pattern=^https://(?:grpc.biliapi.net|app.bilibili.com)/bilibili.(?:app.viewunite.v1.View/View|main.community.reply.v1.Reply/MainList)$,argument="{"purifyComment":1,"logLevel":"4"}",requires-body=1,binary-body-mode=1,max-size=-1,engine=webview,timeout=10,script-path=https://raw.githubusercontent.com/kokoryh/Sparkle/refs/heads/master/dist/bilibili.protobuf.request.js
# JSON cleanup.
bilibili.skin = type=http-response,pattern=^https://app.bilibili.com/x/resource/show/skin?,requires-body=1,max-size=-1,engine=webview,script-path=https://raw.githubusercontent.com/kokoryh/Script/master/js/bili-suit-diy.js
bilibili.live = type=http-response,pattern=^https://api.live.bilibili.com/xlive/(?:app-interface/v2/index/feed|app-room/v1/index/getInfoBy(?:Room|User))?,requires-body=1,max-size=-1,engine=webview,script-path=https://raw.githubusercontent.com/kokoryh/Sparkle/refs/heads/master/dist/bilibili.json.js
bilibili.json = type=http-response,pattern=^https://app.bilibili.com/x/(?:resource/show/tab/v2|v2/(?:splash/(?:list|show|event/list2)|feed/index(?:/story)?|account/(?:mine(?:/ipad)?|myinfo)))?,argument="{"showCreatorHub":0}",requires-body=1,max-size=-1,engine=webview,script-path=https://raw.githubusercontent.com/kokoryh/Sparkle/refs/heads/master/dist/bilibili.json.js
# Strong protobuf response cleanup: video detail page, viewunite, related feed, player, search, comments and PGC player.
bilibili.protobuf = type=http-response,pattern=^https://(?:grpc.biliapi.net|app.bilibili.com)/bilibili.(?:app.(?:show.v1.Popular/Index|dynamic.v2.Dynamic/DynAll|view(?:unite)?.v1.View/(?:View|ViewProgress|RelatesFeed)|playurl.v1.PlayURL/PlayView|playerunite.v1.Player/PlayViewUnite)|polymer.app.search.v1.Search/SearchAll|community.service.dm.v1.DM/DmView|main.community.reply.v1.Reply/MainList|pgc.gateway.player.v2.PlayURL/PlayView)$,argument="{"displayUpList":"auto","purifyComment":1,"sponsorBlock":"#","logLevel":"4"}",requires-body=1,binary-body-mode=1,max-size=-1,engine=webview,timeout=10,script-path=https://raw.githubusercontent.com/kokoryh/Sparkle/refs/heads/master/dist/bilibili.protobuf.response.js
[MITM]
hostname = %APPEND% grpc.biliapi.net,app.bilibili.com,api.bilibili.com,api.live.bilibili.com,line3-h5-mobile-api.biligame.com
