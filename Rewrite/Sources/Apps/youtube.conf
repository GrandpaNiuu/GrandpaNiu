#!name=GrandpaNiu YouTube Source
#!desc=Maasea-based YouTube cleanup with media-chain safe guards
# auto-sync: true
# source-url:
# upstream-script: https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js
# upstream-name: Maasea YouTube response
# risk: high
# white-screen-guard: keep media playback domains out of MITM and reject rewrites

[Rule]
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,QUIC)),REJECT
DOMAIN-SUFFIX,youtube.com,PROXY,pre-matching
DOMAIN-SUFFIX,youtu.be,PROXY,pre-matching
DOMAIN-SUFFIX,googlevideo.com,PROXY,pre-matching
DOMAIN-SUFFIX,ytimg.com,PROXY,pre-matching
DOMAIN-SUFFIX,ggpht.com,PROXY,pre-matching
DOMAIN,youtubei.googleapis.com,PROXY,pre-matching

[Script]
youtube.response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch))(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js,script-update-interval=86400,argument="{"lyricLang":"off","captionLang":"off","blockUpload":true,"blockImmersive":true,"blockShorts":true,"debug":false}"

[MITM]
hostname = %APPEND% youtubei.googleapis.com
