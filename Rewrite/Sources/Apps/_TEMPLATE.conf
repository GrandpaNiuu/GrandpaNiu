# App source template for Release/Modules generation
# Copy this file to Rewrite/Sources/Apps/<app-name>.conf, then keep only the sections actually needed.
# Do not add ordinary comments inside active rule sections unless they are useful for maintenance.

[Rule]
# DOMAIN-SUFFIX,example.com,REJECT
# DOMAIN,ads.example.com,REJECT
# DOMAIN-KEYWORD,example-ad,REJECT

[URL Rewrite]
# ^https?:\/\/example\.com\/ad - reject

[Header Rewrite]
# ^https?:\/\/example\.com\/api header-del x-ad-token

[Body Rewrite]
# ^https?:\/\/example\.com\/api response-body "ad":true "ad":false

[Map Local]
# ^https?:\/\/example\.com\/ad\.json data="{}" status-code=200 header="Content-Type: application/json"

[Script]
# app.response = type=http-response,pattern=^https?:\/\/example\.com\/api,requires-body=1,max-size=-1,script-path=https://example.com/app.js

[MITM]
# hostname = %APPEND% example.com
