# === 新框架 Layer 1：基础拦截层 ===
# 顺序原则：必要 DIRECT 白名单优先，其后远程广告规则、本地域名/IP、URL-REGEX/AND 逻辑。
# 安全边界：不主动拦截支付、登录、验证码、银行证券、微信/支付宝安全、证书校验接口。
# GitHub 去广告规则补充（Surge 端按远程资源自动更新）
