# QingRex mini-program and app lazy ad removal Script layer
# Source module: 小程序和应用懒人去广告合集.official.sgmodule
# Scope: response-body cleaners for selected mini-program endpoints.
# External script paths are preserved from the source module and should be reviewed if failures appear.
# Rollback: remove qingrex_miniapp from [scripts] in Rewrite/Profiles/fusion.conf and rebuild Fusion.

