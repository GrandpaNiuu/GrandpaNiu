name: Upstream candidate collect

on:
  schedule:
    # 16:55 UTC = 00:55 Beijing time. Staggered to reduce GitHub schedule delay/drop risk.
    - cron: "55 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/collect_upstreams.py Rewrite/Generator/Builder.py scripts/validate_remote_rule_syntax.py scripts/validate_repository.py

      - name: Collect trusted upstream candidates
        run: python3 scripts/collect_upstreams.py

      - name: Build fusion factory output
        run: |
          # fusion-build-marker: scripts/build_module.py --build --profile fusion
          python3 Rewrite/Generator/Builder.py --profile fusion --release

      - name: Validate repository
        run: |
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_repository.py

      - name: Commit upstream collect results
        run: |
          set -euo pipefail
          bash scripts/commit_generated_changes.sh \
            "Collect trusted upstream candidates and fusion output" \
            Rewrite/Remotes \
            Rewrite/Sources/Meta.conf \
            Rules/converted \
            Scripts/generated \
            Ronghemokuai.sgmodule \
            Release \
            Web \
            Android \
            Windows \
            reports
