name: Upstream candidate collect

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/collect_upstreams.py scripts/build_module.py scripts/build_release_variants.py scripts/factory_finalize.py scripts/validate_repository.py

      - name: Collect trusted upstream candidates
        run: python3 scripts/collect_upstreams.py

      - name: Build fusion factory output
        run: python3 scripts/build_module.py --build --profile fusion

      - name: Finalize factory output and sync root module
        run: python3 scripts/factory_finalize.py --sync-root

      - name: Generate single fusion release report
        run: python3 scripts/build_release_variants.py

      - name: Validate repository
        run: python3 scripts/validate_repository.py

      - name: Commit upstream collect results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream collect changes to commit."
            exit 0
          fi
          git commit -m "Collect trusted upstream candidates and fusion output"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
