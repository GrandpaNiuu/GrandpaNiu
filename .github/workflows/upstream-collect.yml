name: Upstream candidate collect

on:
  schedule:
    # Daily trusted upstream candidate collection.
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python scripts
        run: |
          python3 -m py_compile scripts/collect_upstreams.py scripts/build_module.py scripts/build_release_variants.py scripts/factory_finalize.py scripts/validate_repository.py

      - name: Collect trusted upstream candidates
        run: |
          python3 scripts/collect_upstreams.py

      - name: Build stable factory output
        run: |
          python3 scripts/build_module.py --build --profile stable

      - name: Finalize factory output and sync root module
        run: |
          python3 scripts/factory_finalize.py --sync-root

      - name: Build independent release variants
        run: |
          python3 scripts/build_release_variants.py

      - name: Validate repository
        run: |
          python3 scripts/validate_repository.py

      - name: Commit upstream collect results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Rewrite/Remotes/candidates.json Rewrite/Remotes/sources.json Rules Scripts Release/Ronghemokuai.sgmodule Release/Ronghemokuai-stable.sgmodule Release/Ronghemokuai-stable-plus.sgmodule Release/Ronghemokuai-lite.sgmodule Release/Ronghemokuai-full.sgmodule Ronghemokuai.sgmodule reports/upstream_collect_report.md reports/module_factory_report.md reports/module_factory_diff_report.md reports/factory_finalize_report.md reports/multi_release_report.md
          if git diff --cached --quiet; then
            echo "No upstream collect changes to commit."
            exit 0
          fi
          git commit -m "Collect trusted upstream candidates and multi-version output"
          git push
