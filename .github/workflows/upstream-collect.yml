name: Upstream candidate collect

on:
  schedule:
    # 16:16 UTC = 00:16 Beijing time.
    - cron: "16 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/collect_upstreams.py scripts/build_module.py scripts/build_release_variants.py scripts/factory_finalize.py scripts/validate_repository.py

      - name: Collect trusted upstream candidates
        run: python3 scripts/collect_upstreams.py

      - name: Build fusion factory output
        run: |
          # fusion-build-marker: scripts/build_module.py --build --profile fusion
          python3 scripts/build_module.py --build --profile fusion

      - name: Finalize factory output and sync root module
        run: python3 scripts/factory_finalize.py --sync-root

      - name: Generate single fusion release report
        run: python3 scripts/build_release_variants.py

      - name: Validate repository
        run: |
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_repository.py

      - name: Commit upstream collect results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          regenerate() {
            # fusion-build-marker: scripts/build_module.py --build --profile fusion
            python3 scripts/collect_upstreams.py
            python3 scripts/build_module.py --build --profile fusion
            python3 scripts/factory_finalize.py --sync-root
            python3 scripts/build_release_variants.py
            python3 scripts/validate_remote_rule_syntax.py
            python3 scripts/validate_repository.py
          }

          commit_changes() {
            git add -A
            if git diff --cached --quiet; then
              echo "No upstream collect changes to commit."
              return 1
            fi
            git commit -m "Collect trusted upstream candidates and fusion output"
          }

          safe_rebase_push() {
            echo "Push failed; trying safe rebase fallback before reset regeneration."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                return 0
              fi
            else
              git rebase --abort || true
            fi
            return 1
          }

          commit_changes || exit 0
          if git push origin HEAD:main; then
            exit 0
          fi
          safe_rebase_push && exit 0

          echo "Push failed; resetting to latest main and regenerating upstream collect outputs."
          for attempt in 2 3; do
            git fetch origin main
            git reset --hard origin/main
            regenerate
            commit_changes || exit 0
            if git push origin HEAD:main; then
              exit 0
            fi
            safe_rebase_push && exit 0
            echo "Push failed on regenerated attempt ${attempt}."
          done

          echo "Push failed after 3 regenerated attempts."
          exit 1