name: Upstream candidate collect

on:
  schedule:
    # 16:55 UTC = 00:55 Beijing time. Staggered to reduce GitHub schedule delay/drop risk.
    - cron: "55 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Acquire cross-workflow maintenance lock
        run: bash tools/acquire_automation_lock.sh

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/collect_upstreams.py Rewrite/Generator/Builder.py scripts/validate_remote_rule_syntax.py scripts/validate_repository.py

      - name: Collect trusted upstream candidates
        id: collect
        run: |
          set -euo pipefail
          python3 scripts/collect_upstreams.py
          if git status --porcelain -- Rules Rewrite/Sources Rewrite/Remotes/sources.json Scripts | grep -q .; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fusion factory output after candidate activation
        if: steps.collect.outputs.source_changed == 'true'
        run: |
          # fusion-build-marker: scripts/build_module.py --build --profile fusion
          python3 Rewrite/Generator/Builder.py --profile fusion --release

      - name: Validate repository
        run: |
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_repository.py

      - name: Commit upstream collect results
        run: |
          set -euo pipefail
          bash scripts/commit_generated_changes.sh \
            "Collect trusted upstream candidates and fusion output" \
            Rewrite/Remotes \
            Rewrite/Sources/Meta.conf \
            Rules/direct.list \
            Rules/spotify-direct.list \
            Rules/youtube-direct.list \
            Rules/reject.list \
            Rules/app-clean.list \
            Rules/web-ads.list \
            Rules/converted \
            Scripts/spotify.conf \
            Scripts/youtube.conf \
            Scripts/app-clean.conf \
            Scripts/generated \
            Ronghemokuai.sgmodule \
            Release \
            Web \
            Android \
            Windows \
            reports

      - name: Release cross-workflow maintenance lock
        if: always()
        run: bash tools/release_automation_lock.sh
