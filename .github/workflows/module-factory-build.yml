name: Module Factory Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Ronghemokuai.sgmodule"
      - "scripts/**"
      - "docs/**"
      - "reports/manual_test_log.md"
      - "Rewrite/**"
      - "Rules/**"
      - "Scripts/**"
      - "Android/**"
      - "Web/**"
      - ".github/workflows/module-factory-build.yml"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py Rewrite/Generator/Builder.py
          node --check Scripts/app-cleaner.js

      - name: Prepare sources
        run: |
          set -euo pipefail
          python3 scripts/import_qingrex_official_module.py
          python3 scripts/dedupe_qq_news_script_path.py
          python3 scripts/build_android_rules.py
          python3 scripts/android_format_check.py
          python3 scripts/convert_quanx_rules.py

      - name: Build factory outputs
        run: |
          set -euo pipefail
          python3 Rewrite/Generator/Builder.py --profile fusion --release --check

      - name: Commit generated files
        run: |
          set -euo pipefail
          git config user.name "module-factory"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated file changes."
            exit 0
          fi
          git commit -m "Build module factory outputs"
          git push
