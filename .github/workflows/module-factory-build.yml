name: Module Factory Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Ronghemokuai.sgmodule"
      - "scripts/build_module.py"
      - "scripts/factory_finalize.py"
      - "Rewrite/Manifest.conf"
      - "Rewrite/Profiles/**"
      - "Rewrite/Remotes/**"
      - "Rewrite/Sources/**"
      - "Rules/**"
      - "Scripts/**"
      - ".github/workflows/module-factory-build.yml"

permissions:
  contents: write

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build factory sources and release module
        run: |
          python3 scripts/build_module.py --extract-from-root --build --profile stable

      - name: Finalize factory split and sync root module
        run: |
          python3 scripts/factory_finalize.py

      - name: Validate generated and synced module
        run: |
          test -f Rewrite/Sources/Meta.conf
          test -f Rewrite/Sources/Rule.conf
          test -f Rewrite/Sources/Script.conf
          test -f Rewrite/Sources/MITM.conf
          test -f Rewrite/Profiles/stable.conf
          test -f Rewrite/Remotes/sources.json
          test -f Release/Ronghemokuai.sgmodule
          test -f Ronghemokuai.sgmodule
          test -f reports/module_factory_report.md
          test -f reports/module_factory_diff_report.md
          test -f reports/factory_finalize_report.md
          test -f Rules/spotify-direct.list
          test -f Rules/youtube-direct.list
          test -f Rules/reject.list
          test -f Rules/app-clean.list
          test -f Rules/web-ads.list
          test -f Scripts/spotify.conf
          test -f Scripts/youtube.conf
          test -f Scripts/app-clean.conf
          grep -q '^\[Rule\]' Ronghemokuai.sgmodule
          grep -q '^\[Script\]' Ronghemokuai.sgmodule
          grep -q '^\[MITM\]' Ronghemokuai.sgmodule
          grep -q 'spotify-json' Ronghemokuai.sgmodule
          grep -q 'spotify-proto' Ronghemokuai.sgmodule
          grep -q 'youtube.response' Ronghemokuai.sgmodule
          grep -q '#!update-url=https://grandpaniuu.github.io/GrandpaNiu/Ronghemokuai.sgmodule' Ronghemokuai.sgmodule

      - name: Commit factory output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Ronghemokuai.sgmodule Rewrite/Sources Release/Ronghemokuai.sgmodule Rules Scripts reports/module_factory_report.md reports/module_factory_diff_report.md reports/factory_finalize_report.md
          git diff --cached --quiet || git commit -m "Build and sync module factory output"
          git push
