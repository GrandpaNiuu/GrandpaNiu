name: Module Factory Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Ronghemokuai.sgmodule"
      - "scripts/build_module.py"
      - "scripts/build_release_variants.py"
      - "scripts/factory_finalize.py"
      - "scripts/validate_repository.py"
      - "scripts/dedupe_qq_news_script_path.py"
      - "Rewrite/Manifest.conf"
      - "Rewrite/Profiles/**"
      - "Rewrite/Remotes/**"
      - "Rewrite/Sources/**"
      - "Rules/**"
      - "Scripts/**"
      - ".github/workflows/module-factory-build.yml"

permissions:
  contents: write

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python scripts
        run: |
          python3 -m py_compile scripts/build_module.py scripts/build_release_variants.py scripts/factory_finalize.py scripts/audit_repair_invalid_sources.py scripts/collect_upstreams.py scripts/validate_repository.py scripts/dedupe_qq_news_script_path.py

      - name: Validate app-cleaner JavaScript syntax
        run: |
          node --check Scripts/app-cleaner.js

      - name: Migrate low-risk JSON cleaners to app-cleaner active
        run: |
          python3 scripts/dedupe_qq_news_script_path.py

      - name: Validate app-cleaner JavaScript syntax after migration
        run: |
          node --check Scripts/app-cleaner.js

      - name: Build stable factory output
        run: |
          python3 scripts/build_module.py --build --profile stable

      - name: Finalize factory output and sync root module
        run: |
          python3 scripts/factory_finalize.py --sync-root

      - name: Build independent release variants
        run: |
          python3 scripts/build_release_variants.py

      - name: Validate repository
        run: |
          python3 scripts/validate_repository.py

      - name: Commit factory output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Ronghemokuai.sgmodule Rewrite/Sources Release/Ronghemokuai.sgmodule Release/Ronghemokuai-stable.sgmodule Release/Ronghemokuai-stable-plus.sgmodule Release/Ronghemokuai-lite.sgmodule Release/Ronghemokuai-full.sgmodule Rules Scripts reports/module_factory_report.md reports/module_factory_diff_report.md reports/factory_finalize_report.md reports/multi_release_report.md reports/script_dedupe_report.md reports/script_consolidation_rollback_report.md reports/app_cleaner_active_report.md
          git diff --cached --quiet || git commit -m "Build multi-version module factory output"
          git push
