name: Module Factory Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "docs/**"
      - "reports/manual_test_log.md"
      - "Rewrite/**"
      - "Rules/**"
      - "Scripts/**"
      - "Android/**"
      - "Web/**"
      - ".github/workflows/module-factory-build.yml"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py Rewrite/Generator/Builder.py
          python3 scripts/validate_generator_config.py
          node --check Scripts/app-cleaner.js

      - name: Build factory outputs
        run: |
          set -euo pipefail
          python3 scripts/import_qingrex_official_module.py
          python3 scripts/dedupe_qq_news_script_path.py
          python3 scripts/build_android_rules.py
          python3 scripts/android_format_check.py
          python3 scripts/convert_quanx_rules.py
          # fusion-build-marker: scripts/build_module.py --build --profile fusion
          python3 Rewrite/Generator/Builder.py --profile fusion --release
          python3 scripts/validate_generator_config.py
          python3 scripts/validate_manifest.py
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_governance_extensions.py
          python3 scripts/validate_profiles.py
          python3 scripts/validate_repository.py

      - name: Commit generated files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          regenerate() {
            python3 scripts/import_qingrex_official_module.py
            python3 scripts/dedupe_qq_news_script_path.py
            python3 scripts/build_android_rules.py
            python3 scripts/android_format_check.py
            python3 scripts/convert_quanx_rules.py
            # fusion-build-marker: scripts/build_module.py --build --profile fusion
            python3 Rewrite/Generator/Builder.py --profile fusion --release
            python3 scripts/validate_generator_config.py
            python3 scripts/validate_manifest.py
            python3 scripts/validate_remote_rule_syntax.py
            python3 scripts/validate_governance_extensions.py
            python3 scripts/validate_profiles.py
            python3 scripts/validate_repository.py
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            regenerate
            git add -A
            if git diff --cached --quiet; then
              echo "No generated file changes."
              exit 0
            fi
            git commit -m "Build module factory outputs [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; rebasing on origin/main and retrying."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
          done

          echo "Push failed after 3 regenerated attempts."
          exit 1
