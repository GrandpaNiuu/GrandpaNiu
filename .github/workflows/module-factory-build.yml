name: Module Factory Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "docs/**"
      - "reports/automated_quality_evidence.md"
      - "Rewrite/**"
      - "Rules/**"
      - "Scripts/**"
      - "Android/**"
      - "Windows/**"
      - "Web/**"
      - ".github/workflows/**"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run full automated quality gate
        run: |
          set -euo pipefail
          python3 Rewrite/Generator/Builder.py --profile fusion --release --check
          python3 scripts/quality_gate.py

      - name: Commit generated files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          regenerate() {
            python3 Rewrite/Generator/Builder.py --profile fusion --release --check
            python3 scripts/quality_gate.py
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            regenerate
            git add \
              Rewrite/Sources/Meta.conf \
              Rules/converted \
              Scripts/generated \
              Ronghemokuai.sgmodule \
              Release \
              Web \
              Android \
              Windows \
              reports
            if git diff --cached --quiet; then
              echo "No generated file changes."
              exit 0
            fi
            git commit -m "Build module factory outputs [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; rebasing on origin/main and retrying."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
          done

          echo "Push failed after 3 regenerated attempts."
          exit 1
