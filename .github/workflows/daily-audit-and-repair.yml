name: Daily invalid rule audit and safe repair

on:
  schedule:
    # 19:00 UTC = 03:00 Beijing time.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run daily audit and safe repair
        run: python scripts/audit_and_repair_module.py

      - name: Commit audit report and safe repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ronghemokuai.sgmodule reports/daily_audit_report.md reports/invalid_history.json
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "Daily audit and safe repair module"
          git push
