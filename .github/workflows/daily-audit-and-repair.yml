name: Daily invalid rule audit and safe repair

on:
  schedule:
    # 16:43 UTC = 00:43 Beijing time. Staggered to reduce GitHub schedule delay/drop risk.
    - cron: "43 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-audit-and-repair.yml"
      - "scripts/audit_and_repair_module.py"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-and-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run daily audit and safe repair
        run: python3 scripts/audit_and_repair_module.py

      - name: Build fusion module after audit
        run: |
          # fusion-build-marker: scripts/build_module.py --build --profile fusion
          python3 scripts/build_module.py --build --profile fusion
          python3 scripts/factory_finalize.py --sync-root
          python3 scripts/build_release_variants.py
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_repository.py

      - name: Commit audit report and safe repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/audit_and_repair_module.py
            python3 scripts/build_module.py --build --profile fusion
            python3 scripts/factory_finalize.py --sync-root
            python3 scripts/build_release_variants.py
            python3 scripts/validate_remote_rule_syntax.py
            python3 scripts/validate_repository.py
            git add -A
            if git diff --cached --quiet; then
              echo "No audit changes to commit."
              exit 0
            fi
            git commit -m "Daily audit and safe fusion repair"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; trying rebase before regenerating."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
          done
          exit 1
