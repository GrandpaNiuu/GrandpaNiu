name: Daily invalid rule audit and safe repair

on:
  schedule:
    # 16:43 UTC = 00:43 Beijing time. Staggered to reduce GitHub schedule delay/drop risk.
    - cron: "43 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-and-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run daily audit and safe repair
        run: python3 scripts/audit_and_repair_module.py

      - name: Build fusion module after audit
        run: |
          # fusion-build-marker: scripts/build_module.py --build --profile fusion
          python3 Rewrite/Generator/Builder.py --profile fusion --release
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_repository.py

      - name: Commit audit report and safe repairs
        run: |
          set -euo pipefail
          bash scripts/commit_generated_changes.sh \
            "Daily audit and safe fusion repair" \
            Rules \
            Rewrite/Sources \
            Rewrite/Remotes \
            Scripts/*.conf \
            Scripts/generated \
            Ronghemokuai.sgmodule \
            Release \
            Web \
            Android \
            Windows \
            reports
