name: Daily invalid rule audit and safe repair

on:
  schedule:
    # 16:43 UTC = 00:43 Beijing time. Staggered to reduce GitHub schedule delay/drop risk.
    - cron: "43 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-and-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Acquire cross-workflow maintenance lock
        run: bash tools/acquire_automation_lock.sh

      - name: Validate audit scripts and current fusion output
        run: |
          python3 -m py_compile scripts/audit_and_repair_module.py scripts/validate_remote_rule_syntax.py scripts/validate_repository.py
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_repository.py

      - name: Audit generated module links without editing outputs
        run: python3 scripts/audit_and_repair_module.py --report-only

      - name: Commit generated-module audit report
        run: |
          set -euo pipefail
          bash scripts/commit_generated_changes.sh \
            "Daily generated module integrity audit" \
            reports

      - name: Release cross-workflow maintenance lock
        if: always()
        run: bash tools/release_automation_lock.sh
