name: Workflow failure issue

on:
  workflow_run:
    workflows:
      - Module Factory Build
      - Daily Module Update
      - Daily invalid source audit and repair
      - Upstream candidate collect
      - Repository Health Check
    types:
      - completed

permissions:
  issues: write
  actions: read
  contents: read

concurrency:
  group: workflow-failure-issue-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  open-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'action_required' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create automation-failure --repo "$REPO" --description "Automated workflow failure" --color D73A4A || true

      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          TITLE="[Automation Failure] ${WORKFLOW_NAME} #${RUN_NUMBER}"
          BODY_FILE="failure_issue_body.md"
          cat > "$BODY_FILE" <<EOF
          ## Workflow failure detected

          | Field | Value |
          |---|---|
          | Workflow | ${WORKFLOW_NAME} |
          | Run number | ${RUN_NUMBER} |
          | Run ID | ${RUN_ID} |
          | Conclusion | ${CONCLUSION} |
          | Event | ${EVENT_NAME} |
          | Branch | ${HEAD_BRANCH} |
          | Commit | ${HEAD_SHA} |
          | Run URL | ${HTML_URL} |

          ## Required checks

          1. Open the failed run and inspect the failed job / step.
          2. Check whether `validate_repository.py` failed.
          3. Check whether Root and Release still match.
          4. Check whether multi-version release files still exist.
          5. Check whether this was caused by a temporary upstream network failure.

          ## Recovery commands

          ```bash
          python3 scripts/build_module.py --build --profile stable
          python3 scripts/factory_finalize.py --sync-root
          python3 scripts/build_release_variants.py
          python3 scripts/validate_repository.py
          python3 scripts/validate_profiles.py
          python3 scripts/repository_health_check.py
          ```

          This issue was created automatically. Close it only after the workflow has returned to `completed / success`.
          EOF

          EXISTING=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file "$BODY_FILE"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file "$BODY_FILE" --label automation-failure
            echo "Created new failure issue"
          fi
