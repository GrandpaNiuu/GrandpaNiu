# This watcher intentionally shows "skipped" when the upstream workflow completed successfully
# or when no failure issue is needed. Skipped here does not mean this watcher is broken.
# It only opens or updates an issue for blocking upstream conclusions:
# failure, timed_out, or action_required. Normal success and concurrency cancellation
# do not open new issues.

name: Workflow failure issue

on:
  workflow_run:
    workflows:
      - Module Factory Build
      - Daily Module Update
      - Daily invalid rule audit and safe repair
      - Daily invalid source audit and repair
      - Scheduled Module Factory Update
      - Upstream app module sync
      - Upstream candidate collect
      - Daily schedule watchdog
      - Repository Health Check
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  issues: write
  actions: read
  contents: read

concurrency:
  group: workflow-failure-issue-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  open-issue:
    # Expected behavior:
    # - success: skipped, no issue
    # - skipped: skipped, no issue, because normal skipped runs can happen in GitHub Actions
    # - failure / timed_out / action_required: open or update issue
    # - cancelled: ignored because cancellation is not a repository correctness failure
    if: ${{ contains(fromJSON('["failure","timed_out","action_required"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create automation-failure --repo "$REPO" --description "Automated workflow failure" --color D73A4A || true

      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          TITLE="[Automation Failure] ${WORKFLOW_NAME}"
          BODY_FILE="failure_issue_body.md"
          export BODY_FILE
          python3 - <<'PY'
          import os
          from pathlib import Path

          body = f"""## Workflow failure detected

          | Field | Value |
          |---|---|
          | Workflow | {os.environ['WORKFLOW_NAME']} |
          | Run number | {os.environ['RUN_NUMBER']} |
          | Run ID | {os.environ['RUN_ID']} |
          | Conclusion | {os.environ['CONCLUSION']} |
          | Event | {os.environ['EVENT_NAME']} |
          | Branch | {os.environ['HEAD_BRANCH']} |
          | Commit | {os.environ['HEAD_SHA']} |
          | Run URL | {os.environ['HTML_URL']} |

          ## Expected watcher behavior

          The `Workflow failure issue` watcher is expected to show `skipped` when upstream workflows complete with `success`, `cancelled`, or when no issue is required. This issue is only created for `failure`, `timed_out`, or `action_required` conclusions.

          ## Required checks

          1. Open the failed run and inspect the failed job / step.
          2. Check whether `validate_repository.py` failed.
          3. Check whether Root and Release still match.
          4. Check whether Fusion root and Release output still match.
          5. Check whether this was caused by a temporary upstream network failure.
          6. Confirm the failed workflow is still using Fusion as the single public module entry.

          ## Recovery commands

          ```bash
          python3 scripts/build_module.py --build --profile fusion
          python3 scripts/factory_finalize.py --sync-root
          python3 scripts/build_release_variants.py
          python3 scripts/validate_repository.py
          python3 scripts/validate_profiles.py
          python3 scripts/repository_health_check.py
          ```

          This issue was created automatically. Close it only after the workflow has returned to `completed / success` or the cancellation has been confirmed as intentional.
          """
          Path(os.environ["BODY_FILE"]).write_text(body, encoding="utf-8")
          PY

          EXISTING=$(gh issue list --repo "$REPO" --state open --search "\"[Automation Failure] ${WORKFLOW_NAME}\" in:title label:automation-failure" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file "$BODY_FILE"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file "$BODY_FILE" --label automation-failure
            echo "Created new failure issue"
          fi

  close-resolved-issues:
    # Close stale automation-failure issues after a newer run for the same workflow succeeds.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Close resolved automation failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          query="\"[Automation Failure] ${WORKFLOW_NAME}\" in:title label:automation-failure"
          mapfile -t issues < <(gh issue list --repo "$REPO" --state open --search "$query" --json number --jq '.[].number')
          if [ "${#issues[@]}" -eq 0 ]; then
            echo "No stale automation failure issues to close."
            exit 0
          fi
          for issue in "${issues[@]}"; do
            gh issue comment "$issue" --repo "$REPO" --body "Resolved by successful ${WORKFLOW_NAME} run #${RUN_NUMBER}: ${HTML_URL}"
            gh issue close "$issue" --repo "$REPO" --reason completed
          done
