name: Scheduled Module Factory Update

on:
  workflow_dispatch:
  schedule:
    # 16:00 UTC = 00:00 Beijing time.
    - cron: "0 16 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scheduled-module-update.yml"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile maintenance scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py Rewrite/Generator/Builder.py

      - name: Build scheduled factory outputs
        run: |
          set -euo pipefail
          python3 scripts/refresh_module_date.py
          python3 Rewrite/Generator/Builder.py --profile fusion --release
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_governance_extensions.py
          python3 scripts/validate_profiles.py
          python3 scripts/validate_repository.py

      - name: Commit scheduled update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          regenerate() {
            python3 scripts/refresh_module_date.py
            python3 Rewrite/Generator/Builder.py --profile fusion --release
            python3 scripts/validate_remote_rule_syntax.py
            python3 scripts/validate_governance_extensions.py
            python3 scripts/validate_profiles.py
            python3 scripts/validate_repository.py
          }

          git add Rewrite/Sources/Meta.conf Ronghemokuai.sgmodule Release Web reports Rewrite/Remotes/Catalog.md
          if git diff --cached --quiet; then
            echo "No scheduled module factory changes to commit."
            exit 0
          fi
          git commit -m "chore: scheduled module factory update"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; rebasing on origin/main and retrying."
            git fetch origin main
            if git rebase origin/main; then
              regenerate
              git add Rewrite/Sources/Meta.conf Ronghemokuai.sgmodule Release Web reports Rewrite/Remotes/Catalog.md
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
          done

          echo "Push failed after 3 attempts."
          exit 1
