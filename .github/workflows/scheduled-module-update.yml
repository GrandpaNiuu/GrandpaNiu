name: Scheduled Module Factory Update

on:
  workflow_dispatch:
  schedule:
    # 17:07 UTC = 01:07 Beijing time. Staggered to reduce GitHub schedule delay/drop risk.
    # Rebuild trigger: refresh generated outputs after Google login proxy policy change.
    - cron: "7 17 * * *"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: module-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Acquire cross-workflow maintenance lock
        run: bash tools/acquire_automation_lock.sh

      - name: Compile maintenance scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py Rewrite/Generator/Builder.py

      - name: Build scheduled factory outputs
        run: |
          set -euo pipefail
          python3 scripts/refresh_module_date.py
          python3 Rewrite/Generator/Builder.py --profile fusion --release
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_governance_extensions.py
          python3 scripts/validate_profiles.py
          python3 scripts/validate_repository.py

      - name: Commit scheduled update
        run: |
          set -euo pipefail
          bash scripts/commit_generated_changes.sh \
            "chore: scheduled module factory update" \
            Rewrite/Sources/Meta.conf \
            Scripts/generated \
            Ronghemokuai.sgmodule \
            Release \
            Web \
            reports \
            Rewrite/Remotes/Catalog.md

      - name: Release cross-workflow maintenance lock
        if: always()
        run: bash tools/release_automation_lock.sh
