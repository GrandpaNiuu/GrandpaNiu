name: Deploy GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Module Factory Build
      - Daily schedule watchdog
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: pages-deploy-main
  cancel-in-progress: false

jobs:
  detect-pages-source:
    runs-on: ubuntu-latest
    outputs:
      deploy_enabled: ${{ steps.detect.outputs.deploy_enabled }}
      build_type: ${{ steps.detect.outputs.build_type }}
    steps:
      - name: Detect Pages source mode
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          if ! curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" \
            > "${response_file}"; then
            echo "build_type=unknown" >> "${GITHUB_OUTPUT}"
            echo "deploy_enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Could not read Pages settings; skipping self-managed Pages deploy."
            exit 0
          fi

          python3 - "${response_file}" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              data = json.load(handle)
          build_type = str(data.get("build_type") or "unknown")
          enabled = "true" if build_type == "workflow" else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"build_type={build_type}\n")
              output.write(f"deploy_enabled={enabled}\n")
          print(f"GitHub Pages build_type={build_type}; self-managed deploy enabled={enabled}")
          if enabled != "true":
              print("::notice::GitHub Pages is not set to GitHub Actions. Default branch Pages deployment will publish the site; skipping self-managed deploy.")
          PY

  deploy:
    needs: detect-pages-source
    if: needs.detect-pages-source.outputs.deploy_enabled == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          copy_path() {
            local source="$1"
            local target="_site/$1"
            if [ ! -e "$source" ]; then
              return 0
            fi
            mkdir -p "$(dirname "$target")"
            cp -R "$source" "$target"
          }

          public_paths=(
            "Ronghemokuai.sgmodule"
            "README.md"
            "LICENSE"
            "SECURITY.md"
            "CONTRIBUTING.md"
            "import.html"
            "android.html"
            "redirect.html"
            "Release"
            "Web"
            "Android"
            "Windows"
            "Rules"
            "Scripts"
            "Rewrite/Remotes"
            "Rewrite/Registry.md"
            "docs"
            "reports"
          )

          for path in "${public_paths[@]}"; do
            copy_path "$path"
          done

          touch _site/.nojekyll
          echo "Prepared Pages artifact:"
          du -sh _site
          find _site -type f | wc -l

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000
          reporting_interval: 10000
          error_count: 30
