name: Upstream app module sync

on:
  workflow_dispatch:
  schedule:
    # 17:19 UTC = 01:19 Beijing time. Staggered to reduce GitHub schedule delay/drop risk.
    - cron: "19 17 * * *"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: module-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sync upstream app modules
        id: upstream-sync
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/sync_upstream_app_modules.py

      - name: Build and validate synced release
        id: factory-build
        if: steps.upstream-sync.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 Rewrite/Generator/Builder.py --profile fusion --release --check

      - name: Roll back failed sync
        if: steps.upstream-sync.outcome != 'success' || steps.factory-build.outcome != 'success'
        run: |
          set -euo pipefail
          git restore Rewrite/Sources/Apps Rewrite/Remotes/app-modules.json Scripts/generated Ronghemokuai.sgmodule Release Web reports || true
          mkdir -p reports
          {
            echo "# Upstream App Module Sync Report"
            echo
            echo "- status: failed"
            echo "- generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- sync: ${{ steps.upstream-sync.outcome }}"
            echo "- build: ${{ steps.factory-build.outcome }}"
            echo
            echo "The upstream app sync was rolled back because sync or build validation failed."
          } > reports/upstream_app_module_sync_report.md
          exit 1

      - name: Commit synced app module updates
        if: steps.upstream-sync.outcome == 'success' && steps.factory-build.outcome == 'success'
        run: |
          set -euo pipefail
          bash scripts/commit_generated_changes.sh \
            "sync: update upstream app modules" \
            Rewrite/Sources/Meta.conf \
            Rewrite/Sources/Apps \
            Rewrite/Remotes/app-modules.json \
            Scripts/generated \
            backup/upstream-app-modules \
            reports \
            Ronghemokuai.sgmodule \
            Release \
            Web
