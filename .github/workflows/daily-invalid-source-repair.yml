name: Daily invalid source audit and repair

on:
  schedule:
    # 16:49 UTC = 00:49 Beijing time. Staggered to reduce GitHub schedule delay/drop risk.
    - cron: "49 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invalid-source-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/collect_upstreams.py scripts/audit_repair_invalid_sources.py Rewrite/Generator/Builder.py scripts/validate_remote_rule_syntax.py scripts/validate_repository.py

      - name: Refresh trusted upstream candidate pool
        run: python3 scripts/collect_upstreams.py

      - name: Run source-first invalid source audit and repair
        run: python3 scripts/audit_repair_invalid_sources.py

      - name: Build fusion factory output
        run: |
          # fusion-build-marker: scripts/build_module.py --build --profile fusion
          python3 Rewrite/Generator/Builder.py --profile fusion --release

      - name: Validate repository
        run: |
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_repository.py

      - name: Commit invalid source report and source-first repairs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          regenerate() {
            python3 scripts/collect_upstreams.py
            python3 scripts/audit_repair_invalid_sources.py
            # fusion-build-marker: scripts/build_module.py --build --profile fusion
            python3 Rewrite/Generator/Builder.py --profile fusion --release
            python3 scripts/validate_remote_rule_syntax.py
            python3 scripts/validate_repository.py
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            regenerate
            git add \
              Rewrite/Remotes \
              Rewrite/Sources \
              Rules \
              Scripts/*.conf \
              Scripts/generated \
              Ronghemokuai.sgmodule \
              Release \
              Web \
              Android \
              Windows \
              reports
            if git diff --cached --quiet; then
              echo "No invalid source changes to commit."
              exit 0
            fi
            git commit -m "Daily source-first invalid source audit and fusion repair"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; trying rebase before regenerating."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
          done
          echo "Push failed after 3 regenerated attempts."
          exit 1
