name: Daily invalid source audit and repair

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  invalid-source-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/audit_repair_invalid_sources.py scripts/build_module.py scripts/build_release_variants.py scripts/factory_finalize.py scripts/validate_repository.py

      - name: Run source-first invalid source audit and repair
        run: python3 scripts/audit_repair_invalid_sources.py

      - name: Build fusion factory output
        run: python3 scripts/build_module.py --build --profile fusion

      - name: Finalize factory output and sync root module
        run: python3 scripts/factory_finalize.py --sync-root

      - name: Generate single fusion release report
        run: python3 scripts/build_release_variants.py

      - name: Validate repository
        run: python3 scripts/validate_repository.py

      - name: Commit invalid source report and source-first repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No invalid source changes to commit."
            exit 0
          fi
          git commit -m "Daily source-first invalid source audit and fusion repair"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
