name: Daily invalid source audit and repair

on:
  schedule:
    # 16:49 UTC = 00:49 Beijing time. Staggered to reduce GitHub schedule delay/drop risk.
    - cron: "49 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invalid-source-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Acquire cross-workflow maintenance lock
        run: bash tools/acquire_automation_lock.sh

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/audit_repair_invalid_sources.py Rewrite/Generator/Builder.py scripts/validate_remote_rule_syntax.py scripts/validate_repository.py

      - name: Run source-first invalid source audit and repair
        id: repair
        run: |
          set -euo pipefail
          python3 scripts/audit_repair_invalid_sources.py
          if git status --porcelain -- Rules Rewrite/Sources Rewrite/Remotes/sources.json Scripts | grep -q .; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fusion factory output after a source repair
        if: steps.repair.outputs.source_changed == 'true'
        run: |
          # fusion-build-marker: scripts/build_module.py --build --profile fusion
          python3 Rewrite/Generator/Builder.py --profile fusion --release

      - name: Validate repository
        run: |
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_repository.py

      - name: Commit invalid source report and source-first repairs
        run: |
          set -euo pipefail
          bash scripts/commit_generated_changes.sh \
            "Daily source-first invalid source audit and fusion repair" \
            Rewrite/Remotes \
            Rewrite/Sources \
            Rules \
            Scripts/*.conf \
            Scripts/generated \
            Ronghemokuai.sgmodule \
            Release \
            Web \
            Android \
            Windows \
            reports

      - name: Release cross-workflow maintenance lock
        if: always()
        run: bash tools/release_automation_lock.sh
