name: Repository Health Check

on:
  schedule:
    # 17:37 UTC = Sunday 01:37 Beijing time. Staggered away from the top of the hour.
    - cron: "37 17 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: module-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Acquire cross-workflow maintenance lock
        run: bash tools/acquire_automation_lock.sh

      - name: Compile maintenance scripts
        run: python3 -m py_compile scripts/*.py Rewrite/Generator/Builder.py

      - name: Build health reports
        run: |
          set -euo pipefail
          python3 Rewrite/Generator/Builder.py --profile fusion --release --check
          python3 scripts/quality_gate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit repository health report
        run: |
          set -euo pipefail
          bash scripts/commit_generated_changes.sh \
            "Update repository health reports [skip ci]" \
            Rewrite/Sources/Meta.conf \
            Rules/converted \
            Scripts/generated \
            Ronghemokuai.sgmodule \
            Release \
            Web \
            Android \
            Windows \
            reports

      - name: Release cross-workflow maintenance lock
        if: always()
        run: bash tools/release_automation_lock.sh
