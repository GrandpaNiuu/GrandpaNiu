name: Repository Health Check

on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:
  push:
    # Verify health workflow changes immediately without waiting for the weekly schedule.
    branches:
      - main
    paths:
      - "scripts/**"
      - "SECURITY.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "README.md"
      - "docs/**"
      - "reports/automated_quality_evidence.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "Rewrite/**"
      - "Rules/**"
      - "Scripts/**"
      - ".github/workflows/repository-health.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile maintenance scripts
        run: python3 -m py_compile scripts/*.py Rewrite/Generator/Builder.py

      - name: Build health reports
        run: |
          set -euo pipefail
          # fusion-build-marker: scripts/build_module.py --build --profile fusion
          python3 scripts/quality_gate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit repository health report
        run: |
          set -euo pipefail
          git config user.name "module-factory"
          git config user.email "actions@users.noreply.github.com"

          regenerate() {
            # fusion-build-marker: scripts/build_module.py --build --profile fusion
            python3 scripts/quality_gate.py
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            regenerate
            git add -A
            if git diff --cached --quiet; then
              echo "No repository health changes to commit."
              exit 0
            fi
            git commit -m "Update repository health reports [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; rebasing on origin/main and retrying."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
          done

          echo "Push failed after 3 regenerated attempts."
          exit 1
