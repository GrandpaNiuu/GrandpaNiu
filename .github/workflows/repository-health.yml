name: Repository Health Check

on:
  schedule:
    # 20:11 UTC Sunday = 04:11 Beijing time Monday.
    - cron: "11 20 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/validate_repository.py"
      - "scripts/repository_health_check.py"
      - "scripts/build_release_variants.py"
      - "scripts/audit_compat_sources.py"
      - "scripts/split_mitm_sources.py"
      - "scripts/validate_profiles.py"
      - "scripts/generate_app_coverage_matrix.py"
      - "scripts/generate_change_impact_report.py"
      - "scripts/generate_workflow_health_report.py"
      - "scripts/generate_stable_plus_promotion_report.py"
      - "scripts/generate_script_inventory_report.py"
      - "scripts/dedupe_qq_news_script_path.py"
      - "scripts/score_candidates.py"
      - "scripts/check_report_freshness.py"
      - "scripts/audit_domestic_app_connectivity.py"
      - "SECURITY.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "README.md"
      - "docs/TESTING.md"
      - "docs/SCRIPT_REVIEW.md"
      - "docs/SCRIPT_CONSOLIDATION_PLAN.md"
      - "docs/MITM_POLICY.md"
      - "docs/VERSIONING.md"
      - "docs/QUALITY_GATE.md"
      - "docs/RELEASE.md"
      - "docs/PERFORMANCE.md"
      - "docs/ROADMAP.md"
      - "docs/PROFILE_POLICY.md"
      - "docs/MODULE_FEATURES.md"
      - "docs/AUTOMATION_POLICY.md"
      - "reports/manual_test_log.md"
      - "Rewrite/Profiles/**"
      - "Rewrite/Sources/**"
      - "Rewrite/Remotes/**"
      - "Rules/**"
      - "Scripts/**"
      - ".github/workflows/repository-health.yml"
      - ".github/workflows/workflow-failure-issue.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compile maintenance scripts
        run: |
          python3 -m py_compile scripts/build_module.py scripts/build_release_variants.py scripts/factory_finalize.py scripts/audit_repair_invalid_sources.py scripts/collect_upstreams.py scripts/validate_repository.py scripts/repository_health_check.py scripts/audit_compat_sources.py scripts/split_mitm_sources.py scripts/validate_profiles.py scripts/generate_app_coverage_matrix.py scripts/generate_change_impact_report.py scripts/generate_workflow_health_report.py scripts/generate_stable_plus_promotion_report.py scripts/generate_script_inventory_report.py scripts/dedupe_qq_news_script_path.py scripts/score_candidates.py scripts/check_report_freshness.py scripts/audit_domestic_app_connectivity.py

      - name: Validate app-cleaner JavaScript syntax
        run: node --check Scripts/app-cleaner.js

      - name: Migrate low-risk JSON cleaners to app-cleaner active
        run: python3 scripts/dedupe_qq_news_script_path.py

      - name: Validate app-cleaner JavaScript syntax after migration
        run: node --check Scripts/app-cleaner.js

      - name: Build stable module
        run: python3 scripts/build_module.py --build --profile stable

      - name: Sync root module
        run: python3 scripts/factory_finalize.py --sync-root

      - name: Build independent release variants
        run: python3 scripts/build_release_variants.py

      - name: Validate repository
        run: python3 scripts/validate_repository.py

      - name: Generate compatibility migration report
        run: python3 scripts/audit_compat_sources.py

      - name: Generate MITM split report
        run: python3 scripts/split_mitm_sources.py

      - name: Rebuild independent release variants after MITM split
        run: python3 scripts/build_release_variants.py

      - name: Validate profiles
        run: python3 scripts/validate_profiles.py

      - name: Generate app coverage matrix
        run: python3 scripts/generate_app_coverage_matrix.py

      - name: Generate Stable Plus promotion candidates
        run: python3 scripts/generate_stable_plus_promotion_report.py

      - name: Generate script inventory report
        run: python3 scripts/generate_script_inventory_report.py

      - name: Generate candidate security score report
        run: python3 scripts/score_candidates.py

      - name: Generate domestic app connectivity audit
        run: python3 scripts/audit_domestic_app_connectivity.py

      - name: Generate change impact report
        run: python3 scripts/generate_change_impact_report.py

      - name: Generate workflow health report
        run: python3 scripts/generate_workflow_health_report.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate report freshness report
        run: python3 scripts/check_report_freshness.py

      - name: Generate repository health report
        run: python3 scripts/repository_health_check.py

      - name: Restore stable release after profile validation
        run: |
          python3 scripts/build_module.py --build --profile stable
          python3 scripts/factory_finalize.py --sync-root
          python3 scripts/build_release_variants.py
          python3 scripts/validate_repository.py

      - name: Commit repository health report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Ronghemokuai.sgmodule Release/Ronghemokuai.sgmodule Release/Ronghemokuai-stable.sgmodule Release/Ronghemokuai-stable-plus.sgmodule Release/Ronghemokuai-lite.sgmodule Release/Ronghemokuai-full.sgmodule Rules/direct.list Rules/wechat-ad.list Scripts/app-clean.conf Scripts/app-cleaner.js Scripts/app-cleaner.config.json Scripts/app-cleaner-active.conf Rewrite/Profiles/stable-plus.conf Rewrite/Sources/Script.conf Rewrite/Sources/MITM-core.conf Rewrite/Sources/MITM-app-clean.conf Rewrite/Sources/MITM-stable-plus.conf Rewrite/Sources/MITM-extended.conf reports/module_factory_report.md reports/module_factory_diff_report.md reports/factory_finalize_report.md reports/multi_release_report.md reports/repository_health_report.md reports/compat_migration_report.md reports/mitm_split_report.md reports/profile_validation_report.md reports/app_coverage_matrix.md reports/stable_plus_promotion_report.md reports/script_inventory_report.md reports/script_dedupe_report.md reports/script_consolidation_rollback_report.md reports/app_cleaner_active_report.md reports/app_cleaner_refactor_report.md reports/candidate_security_score_report.md reports/report_freshness_report.md reports/domestic_app_connectivity_audit.md reports/media_wechat_false_positive_report.md reports/change_impact_report.md reports/workflow_health_report.md reports/manual_test_log.md reports/repository_maturity_review.md reports/wechat_ad_test_report.md
          if git diff --cached --quiet; then
            echo "No repository health changes to commit."
            exit 0
          fi
          git commit -m "Update repository health and governance reports"
          git push
