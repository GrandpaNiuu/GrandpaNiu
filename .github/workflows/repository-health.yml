name: Repository Health Check

on:
  schedule:
    # 20:11 UTC Sunday = 04:11 Beijing time Monday.
    - cron: "11 20 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/validate_repository.py"
      - "scripts/repository_health_check.py"
      - "docs/QUALITY_GATE.md"
      - "docs/RELEASE.md"
      - "docs/PERFORMANCE.md"
      - ".github/workflows/repository-health.yml"

permissions:
  contents: write

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile maintenance scripts
        run: |
          python3 -m py_compile scripts/build_module.py scripts/factory_finalize.py scripts/audit_repair_invalid_sources.py scripts/collect_upstreams.py scripts/validate_repository.py scripts/repository_health_check.py

      - name: Build stable module
        run: python3 scripts/build_module.py --build --profile stable

      - name: Sync root module
        run: python3 scripts/factory_finalize.py --sync-root

      - name: Validate repository
        run: python3 scripts/validate_repository.py

      - name: Generate repository health report
        run: python3 scripts/repository_health_check.py

      - name: Commit repository health report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Ronghemokuai.sgmodule Release/Ronghemokuai.sgmodule reports/module_factory_report.md reports/module_factory_diff_report.md reports/factory_finalize_report.md reports/repository_health_report.md
          if git diff --cached --quiet; then
            echo "No repository health changes to commit."
            exit 0
          fi
          git commit -m "Update repository health report"
          git push
