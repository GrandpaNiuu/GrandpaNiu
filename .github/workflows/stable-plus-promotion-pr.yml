name: Fusion Promotion Review

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Single App name to evaluate in Fusion"
        required: true
        default: "未指定"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  promotion-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile maintenance scripts
        run: python3 -m py_compile scripts/create_promotion_pr.py scripts/build_module.py scripts/factory_finalize.py scripts/build_release_variants.py scripts/validate_repository.py scripts/validate_profiles.py

      - name: Generate Fusion review report
        run: python3 scripts/create_promotion_pr.py --app "${{ github.event.inputs.app }}"

      - name: Build and validate Fusion module
        run: |
          python3 scripts/build_module.py --build --profile fusion
          python3 scripts/factory_finalize.py --sync-root
          python3 scripts/build_release_variants.py
          python3 scripts/validate_profiles.py
          python3 scripts/validate_repository.py

      - name: Print review report
        run: |
          if [ -f reports/promotion_pr_report.md ]; then
            cat reports/promotion_pr_report.md
          else
            echo "promotion_pr_report.md was not generated"
            exit 1
          fi
