name: Daily Module Update

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-module-update.yml"
      - "scripts/**"
      - "Rewrite/**"
      - "Rules/**"
      - "Scripts/**"
      - "Android/**"
      - "Windows/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile maintenance scripts
        run: python3 -m py_compile scripts/*.py Rewrite/Generator/Builder.py

      - name: Generate and commit daily update
        run: |
          set -euo pipefail
          git config user.name "module-factory"
          git config user.email "actions@users.noreply.github.com"

          update_date() {
            python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          today = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d")
          meta = Path("Rewrite/Sources/Meta.conf")
          text = meta.read_text(encoding="utf-8")
          text = re.sub(r"^#!desc=.*$", f"#!desc={today} / fusion", text, flags=re.M)
          text = re.sub(r"^# update-date:.*$", f"# update-date: {today}", text, flags=re.M)
          meta.write_text(text, encoding="utf-8", newline="\n")

          report = Path("reports/daily_update_report.md")
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text("\n".join([
              "# Daily module update report",
              "",
              f"- Date: {today}",
              "- Profile: fusion",
              "- Entry: Ronghemokuai.sgmodule",
              "",
          ]), encoding="utf-8", newline="\n")
          PY
          }

          regenerate() {
            update_date
            python3 scripts/import_qingrex_official_module.py
            python3 scripts/dedupe_qq_news_script_path.py
            python3 scripts/convert_quanx_rules.py
            # fusion-build-marker: scripts/build_module.py --build --profile fusion
            # Builder release path runs scripts/factory_finalize.py --sync-root and scripts/build_release_variants.py.
            python3 Rewrite/Generator/Builder.py --profile fusion --release
            python3 scripts/validate_remote_rule_syntax.py
            python3 scripts/validate_governance_extensions.py
            python3 scripts/validate_repository.py
            python3 scripts/quality_gate.py
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            regenerate
            git add -A
            if git diff --cached --quiet; then
              echo "No daily update changes to commit."
              exit 0
            fi
            git commit -m "Daily fusion module update [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; rebasing on origin/main and retrying."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
          done

          echo "Push failed after 3 regenerated attempts."
          exit 1
