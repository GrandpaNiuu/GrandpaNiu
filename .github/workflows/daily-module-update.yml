name: Daily Module Update

on:
  schedule:
    # 18:00 UTC = 02:00 Beijing time next day.
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-module-update.yml"
      - "scripts/validate_repository.py"
      - "scripts/build_module.py"
      - "scripts/build_release_variants.py"
      - "scripts/factory_finalize.py"
      - "scripts/repository_health_check.py"
      - "Rewrite/Sources/Meta.conf"

permissions:
  contents: write
  actions: read

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile maintenance scripts
        run: |
          python3 -m py_compile scripts/build_module.py scripts/build_release_variants.py scripts/factory_finalize.py scripts/validate_repository.py scripts/repository_health_check.py

      - name: Update source metadata date, build, finalize and report
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re
          import subprocess
          import urllib.request

          meta = Path("Rewrite/Sources/Meta.conf")
          module = Path("Ronghemokuai.sgmodule")
          release = Path("Release/Ronghemokuai.sgmodule")
          report = Path("reports/daily_update_report.md")
          report.parent.mkdir(parents=True, exist_ok=True)

          if not meta.exists():
              raise SystemExit("Rewrite/Sources/Meta.conf not found")

          today = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d")
          meta_text = meta.read_text(encoding="utf-8")
          meta_text = re.sub(r"^#!desc=.*$", f"#!desc={today}", meta_text, flags=re.M)
          meta_text = re.sub(r"^# update-date:.*$", f"# update-date: {today}", meta_text, flags=re.M)
          meta.write_text(meta_text, encoding="utf-8", newline="\n")

          build = subprocess.run(["python3", "scripts/build_module.py", "--build", "--profile", "stable"], text=True, capture_output=True)
          if build.returncode != 0:
              raise SystemExit((build.stdout + build.stderr).strip())
          finalize = subprocess.run(["python3", "scripts/factory_finalize.py", "--sync-root"], text=True, capture_output=True)
          if finalize.returncode != 0:
              raise SystemExit((finalize.stdout + finalize.stderr).strip())
          variants = subprocess.run(["python3", "scripts/build_release_variants.py"], text=True, capture_output=True)
          if variants.returncode != 0:
              raise SystemExit((variants.stdout + variants.stderr).strip())

          text = module.read_text(encoding="utf-8")
          release_text = release.read_text(encoding="utf-8")
          if text != release_text:
              raise SystemExit("Root and Release differ after daily build/finalize")

          required_variant_files = [
              "Release/Ronghemokuai-stable.sgmodule",
              "Release/Ronghemokuai-stable-plus.sgmodule",
              "Release/Ronghemokuai-lite.sgmodule",
              "Release/Ronghemokuai-full.sgmodule",
          ]
          missing_variants = [path for path in required_variant_files if not Path(path).exists()]
          if missing_variants:
              raise SystemExit("Missing release variants: " + ", ".join(missing_variants))

          section_checks = {
              "[Rule]": "[Rule]" in text,
              "[URL Rewrite]": "[URL Rewrite]" in text,
              "[Header Rewrite]": "[Header Rewrite]" in text,
              "[Body Rewrite]": "[Body Rewrite]" in text,
              "[Map Local]": "[Map Local]" in text,
              "[Script]": "[Script]" in text,
              "[MITM]": "[MITM]" in text,
          }
          core_checks = {
              "spotify-json": "spotify-json" in text,
              "spotify-proto": "spotify-proto" in text,
              "youtube.response": "youtube.response" in text,
              "zhihu-enhance": "zhihu-enhance" in text,
              "zhihu-enhance.js": "zhihu-enhance.js" in text,
              "update-url": "#!update-url=https://grandpaniuu.github.io/GrandpaNiu/Ronghemokuai.sgmodule" in text,
              "meta-date": f"#!desc={today}" in text and f"# update-date: {today}" in text,
          }
          missing = [name for name, ok in {**section_checks, **core_checks}.items() if not ok]
          if missing:
              raise SystemExit("Missing required module markers: " + ", ".join(missing))

          urls = [
              "https://grandpaniuu.github.io/GrandpaNiu/Ronghemokuai.sgmodule",
              "https://raw.githubusercontent.com/GrandpaNiuu/GrandpaNiu/main/Scripts/zhihu-enhance.js",
              "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list",
              "https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules_surge_domainset.txt",
              "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-surge2.txt",
              "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list",
              "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/reject.txt",
              "https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblocksurge.list",
              "https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-json.js",
              "https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-proto.js",
              "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js",
          ]

          def check_url(url: str) -> str:
              headers = {"User-Agent": "GrandpaNiu-Daily-Module-Check/1.0"}
              try:
                  req = urllib.request.Request(url, method="HEAD", headers=headers)
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      if 200 <= resp.status < 400:
                          return f"OK HTTP {resp.status}"
                      return f"WARN HTTP {resp.status}"
              except Exception as head_error:
                  try:
                      req = urllib.request.Request(url, headers={**headers, "Range": "bytes=0-2048"})
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          body = resp.read(2048)
                          if resp.status in (200, 206) and body:
                              return f"OK GET HTTP {resp.status}"
                          return f"WARN GET HTTP {resp.status} empty"
                  except Exception as get_error:
                      return f"CHECK_FAILED HEAD={head_error} GET={get_error}"

          url_results = [(url, check_url(url)) for url in urls]
          validator = subprocess.run(["python3", "scripts/validate_repository.py"], text=True, capture_output=True)
          validate_output = (validator.stdout + validator.stderr).strip() or "no output"
          if validator.returncode != 0:
              raise SystemExit(validate_output)

          health = subprocess.run(["python3", "scripts/repository_health_check.py"], text=True, capture_output=True)
          health_output = (health.stdout + health.stderr).strip() or "no output"
          if health.returncode != 0:
              raise SystemExit(health_output)

          lines = [
              "# 每日模块更新报告",
              "",
              f"- 日期：{today}",
              "- 日期源头：Rewrite/Sources/Meta.conf",
              "- 构建流程：Meta.conf -> build_module.py --build --profile stable -> factory_finalize.py --sync-root -> build_release_variants.py -> validate_repository.py -> repository_health_check.py",
              "",
              "## 完整区块检查结果",
              "",
          ]
          lines += [f"- `{name}`：{'通过' if ok else '缺失'}" for name, ok in section_checks.items()]
          lines += ["", "## 核心检查结果", ""]
          lines += [f"- `{name}`：{'通过' if ok else '缺失'}" for name, ok in core_checks.items()]
          lines += ["", "## 多版本文件检查", ""]
          lines += [f"- `{path}`：通过" for path in required_variant_files]
          lines += ["", "## 远程链接检查结果", ""]
          lines += [f"- `{url}`：{result}" for url, result in url_results]
          lines += ["", "## validate_repository.py 输出", "", "```text", validate_output, "```"]
          lines += ["", "## repository_health_check.py 输出", "", "```text", health_output, "```"]
          lines += [
              "",
              "## 自动更新边界说明",
              "",
              "- 本 workflow 会更新源头日期、重新构建 stable、同步 Release 与 Root，并生成四个独立 Release 版本。",
              "- 默认根目录 Ronghemokuai.sgmodule 仍保持 stable。",
              "- 不自动删除规则。",
              "- 不自动注释脚本。",
              "- 不自动替换 Spotify / YouTube / 知乎核心脚本。",
              "- 不自动修改 MITM hostname 内容；MITM 分层由 profile 选择，源头完整列表保留可回滚。",
              "",
          ]
          report.write_text("\n".join(lines), encoding="utf-8", newline="\n")
          PY

      - name: Commit daily update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Rewrite/Sources/Meta.conf Ronghemokuai.sgmodule Release/Ronghemokuai.sgmodule Release/Ronghemokuai-stable.sgmodule Release/Ronghemokuai-stable-plus.sgmodule Release/Ronghemokuai-lite.sgmodule Release/Ronghemokuai-full.sgmodule reports/daily_update_report.md reports/module_factory_report.md reports/module_factory_diff_report.md reports/factory_finalize_report.md reports/multi_release_report.md reports/repository_health_report.md
          git diff --cached --quiet || git commit -m "Daily multi-version module update"
          git push
