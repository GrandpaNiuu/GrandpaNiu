name: Daily Module Update

on:
  schedule:
    # 16:37 UTC = 00:37 Beijing time. Staggered to reduce GitHub schedule delay/drop risk.
    - cron: "37 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compile maintenance scripts
        run: python3 -m py_compile scripts/*.py Rewrite/Generator/Builder.py

      - name: Generate and commit daily update
        run: |
          set -euo pipefail
          python3 scripts/refresh_module_date.py
          python3 scripts/import_qingrex_official_module.py
          python3 scripts/dedupe_qq_news_script_path.py
          python3 scripts/convert_quanx_rules.py
          # fusion-build-marker: scripts/build_module.py --build --profile fusion
          # Builder release path runs scripts/factory_finalize.py --sync-root and scripts/build_release_variants.py.
          python3 Rewrite/Generator/Builder.py --profile fusion --release
          python3 scripts/validate_remote_rule_syntax.py
          python3 scripts/validate_governance_extensions.py
          python3 scripts/validate_repository.py
          python3 scripts/quality_gate.py
          bash scripts/commit_generated_changes.sh \
            "Daily fusion module update [skip ci]" \
            Rewrite/Sources/Meta.conf \
            Rewrite/Sources \
            Rewrite/Remotes/Catalog.md \
            Rewrite/Remotes/candidates.json \
            Rewrite/Remotes/sources.json \
            Rules/converted \
            Scripts/*.conf \
            Scripts/generated \
            Ronghemokuai.sgmodule \
            Release \
            Web \
            Android \
            Windows \
            reports
