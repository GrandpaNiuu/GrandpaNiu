name: Daily Module Update

on:
  schedule:
    # 18:00 UTC = 02:00 Beijing time next day.
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-module-update.yml"
      - "scripts/validate_repository.py"

permissions:
  contents: write

concurrency:
  group: module-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile validator
        run: python3 -m py_compile scripts/validate_repository.py

      - name: Update date and generate daily report
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re
          import subprocess
          import urllib.request

          module = Path("Ronghemokuai.sgmodule")
          report = Path("reports/daily_update_report.md")
          report.parent.mkdir(parents=True, exist_ok=True)

          if not module.exists():
              raise SystemExit("Ronghemokuai.sgmodule not found")

          text = module.read_text(encoding="utf-8")
          today = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d")

          section_checks = {
              "[Rule]": "[Rule]" in text,
              "[URL Rewrite]": "[URL Rewrite]" in text,
              "[Header Rewrite]": "[Header Rewrite]" in text,
              "[Body Rewrite]": "[Body Rewrite]" in text,
              "[Map Local]": "[Map Local]" in text,
              "[Script]": "[Script]" in text,
              "[MITM]": "[MITM]" in text,
          }
          core_checks = {
              "spotify-json": "spotify-json" in text,
              "spotify-proto": "spotify-proto" in text,
              "youtube.response": "youtube.response" in text,
              "zhihu-enhance": "zhihu-enhance" in text,
              "update-url": "#!update-url=https://grandpaniuu.github.io/GrandpaNiu/Ronghemokuai.sgmodule" in text,
          }
          missing = [name for name, ok in {**section_checks, **core_checks}.items() if not ok]
          if missing:
              raise SystemExit("Missing required module markers: " + ", ".join(missing))

          urls = [
              "https://grandpaniuu.github.io/GrandpaNiu/Ronghemokuai.sgmodule",
              "https://raw.githubusercontent.com/GrandpaNiuu/GrandpaNiu/main/Scripts/zhihu-enhance.js",
              "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list",
              "https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules_surge_domainset.txt",
              "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-surge2.txt",
              "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list",
              "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/reject.txt",
              "https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblocksurge.list",
              "https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-json.js",
              "https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-proto.js",
              "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js",
          ]

          def check_url(url: str) -> str:
              headers = {"User-Agent": "GrandpaNiu-Daily-Module-Check/1.0"}
              try:
                  req = urllib.request.Request(url, method="HEAD", headers=headers)
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      if 200 <= resp.status < 400:
                          return f"OK HTTP {resp.status}"
                      return f"WARN HTTP {resp.status}"
              except Exception as head_error:
                  try:
                      req = urllib.request.Request(url, headers={**headers, "Range": "bytes=0-2048"})
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          body = resp.read(2048)
                          if resp.status in (200, 206) and body:
                              return f"OK GET HTTP {resp.status}"
                          return f"WARN GET HTTP {resp.status} empty"
                  except Exception as get_error:
                      return f"CHECK_FAILED HEAD={head_error} GET={get_error}"

          url_results = [(url, check_url(url)) for url in urls]
          validator = subprocess.run(
              ["python3", "scripts/validate_repository.py"],
              text=True,
              capture_output=True,
          )
          validate_output = (validator.stdout + validator.stderr).strip() or "no output"
          if validator.returncode != 0:
              raise SystemExit(validate_output)

          text = re.sub(r"^#!desc=.*$", f"#!desc={today}", text, flags=re.M)
          text = re.sub(r"^# update-date:.*$", f"# update-date: {today}", text, flags=re.M)
          module.write_text(text, encoding="utf-8", newline="\n")

          lines = [
              "# 每日模块更新报告",
              "",
              f"- 日期：{today}",
              "",
              "## 完整区块检查结果",
              "",
          ]
          lines += [f"- `{name}`：{'通过' if ok else '缺失'}" for name, ok in section_checks.items()]
          lines += ["", "## Spotify 检查结果", ""]
          lines += [f"- `{name}`：{'通过' if core_checks[name] else '缺失'}" for name in ("spotify-json", "spotify-proto")]
          lines += ["", "## YouTube 检查结果", "", f"- `youtube.response`：{'通过' if core_checks['youtube.response'] else '缺失'}"]
          lines += ["", "## 知乎增强检查结果", "", f"- `zhihu-enhance`：{'通过' if core_checks['zhihu-enhance'] else '缺失'}"]
          lines += ["", "## update-url 检查结果", "", f"- `update-url`：{'通过' if core_checks['update-url'] else '缺失'}"]
          lines += ["", "## 远程链接检查结果", ""]
          lines += [f"- `{url}`：{result}" for url, result in url_results]
          lines += ["", "## validate_repository.py 输出", "", "```text", validate_output, "```"]
          lines += [
              "",
              "## 自动更新边界说明",
              "",
              "- 本 workflow 只做日期更新、结构检查、远程链接检查和报告生成。",
              "- 不自动删除规则。",
              "- 不自动注释脚本。",
              "- 不自动替换 Spotify / YouTube / 知乎核心脚本。",
              "- 不自动修改 MITM hostname。",
              "",
          ]
          report.write_text("\n".join(lines), encoding="utf-8", newline="\n")
          PY

      - name: Commit daily update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Ronghemokuai.sgmodule reports/daily_update_report.md
          git diff --cached --quiet || git commit -m "Daily module update"
          git push
