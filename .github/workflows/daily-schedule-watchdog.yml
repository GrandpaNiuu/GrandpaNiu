name: Daily schedule watchdog

on:
  workflow_dispatch:
  schedule:
    # 20:30 UTC = 04:30 Beijing time. Recover if GitHub drops or delays the daily refresh.
    - cron: "30 20 * * *"

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Recover missed daily module refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          beijing_today() {
            TZ=Asia/Shanghai date +'%Y-%m-%d'
          }

          module_date() {
            grep -m1 '^# update-date:' Ronghemokuai.sgmodule | sed 's/^# update-date:[[:space:]]*//' || true
          }

          regenerate() {
            python3 scripts/refresh_module_date.py
            python3 scripts/convert_quanx_rules.py
            # fusion-build-marker: scripts/build_module.py --build --profile fusion
            python3 Rewrite/Generator/Builder.py --profile fusion --release
            python3 scripts/validate_remote_rule_syntax.py
            python3 scripts/validate_governance_extensions.py
            python3 scripts/validate_profiles.py
            python3 scripts/validate_repository.py
            python3 scripts/quality_gate.py
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            today="$(beijing_today)"
            current="$(module_date)"
            echo "Beijing today: ${today}"
            echo "Current module update-date: ${current:-missing}"

            if [ "${current}" = "${today}" ]; then
              echo "Daily module date is already fresh; no watchdog recovery needed."
              exit 0
            fi

            regenerate
            git add Rewrite/Sources/Meta.conf Scripts/generated Ronghemokuai.sgmodule Release Web reports Rewrite/Remotes/Catalog.md

            if git diff --cached --quiet; then
              echo "Watchdog regenerated outputs but found no changes to commit."
              exit 0
            fi

            git commit -m "chore: recover missed scheduled module update"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed on attempt ${attempt}; rebasing on origin/main and retrying."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
          done

          echo "Watchdog push failed after 3 attempts."
          exit 1
