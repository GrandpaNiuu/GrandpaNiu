name: Daily schedule watchdog

on:
  workflow_dispatch:
  schedule:
    # 20:30 UTC = 04:30 Beijing time. Recover if GitHub drops or delays the daily refresh.
    - cron: "30 20 * * *"

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: module-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Acquire cross-workflow maintenance lock
        run: bash tools/acquire_automation_lock.sh

      - name: Recover missed daily module refresh and report automation status
        run: |
          set -euo pipefail
          beijing_today() {
            TZ=Asia/Shanghai date +'%Y-%m-%d'
          }

          module_date() {
            grep -m1 '^# update-date:' Ronghemokuai.sgmodule | sed 's/^# update-date:[[:space:]]*//' || true
          }

          regenerate() {
            python3 scripts/refresh_module_date.py
            python3 scripts/convert_quanx_rules.py
            # fusion-build-marker: scripts/build_module.py --build --profile fusion
            python3 Rewrite/Generator/Builder.py --profile fusion --release
            python3 scripts/validate_remote_rule_syntax.py
            python3 scripts/validate_governance_extensions.py
            python3 scripts/validate_profiles.py
            python3 scripts/validate_repository.py
            python3 scripts/quality_gate.py
          }

          today="$(beijing_today)"
          current="$(module_date)"
          echo "Beijing today: ${today}"
          echo "Current module update-date: ${current:-missing}"

          if [ "${current}" = "${today}" ]; then
            echo "Daily module date is already fresh; no watchdog recovery needed."
          else
            regenerate
          fi

          python3 scripts/check_automation_status.py
          bash scripts/commit_generated_changes.sh \
            "chore: recover missed scheduled module update" \
            Rewrite/Sources/Meta.conf \
            Scripts/generated \
            Ronghemokuai.sgmodule \
            Release \
            Android \
            Windows \
            Web \
            reports \
            Rewrite/Remotes/Catalog.md

      - name: Validate unattended automation status
        run: python3 scripts/check_automation_status.py --strict --no-write

      - name: Release cross-workflow maintenance lock
        if: always()
        run: bash tools/release_automation_lock.sh
