<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GrandpaNiu 多版本导入</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #1f6feb 0, #0d1117 44%, #05070a 100%);
      color: #f0f6fc;
      padding: 24px;
    }
    .wrap { width: 100%; max-width: 1080px; margin: 0 auto; }
    header { text-align: center; margin: 18px 0 26px; }
    h1 { margin: 0 0 10px; font-size: 34px; }
    p { margin: 8px 0; color: #c9d1d9; line-height: 1.65; }
    .warning {
      margin: 18px auto 24px;
      padding: 14px 16px;
      max-width: 860px;
      border-radius: 16px;
      background: rgba(248, 81, 73, 0.13);
      border: 1px solid rgba(248, 81, 73, 0.35);
      color: #ffd8d4;
      text-align: left;
    }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .card {
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid rgba(240, 246, 252, 0.14);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.32);
    }
    .card h2 { margin: 0 0 8px; font-size: 22px; }
    .tag {
      display: inline-block;
      margin: 0 0 10px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #30363d;
      color: #f0f6fc;
      font-size: 12px;
      font-weight: 700;
    }
    .stable { background: #238636; }
    .plus { background: #8957e5; }
    .lite { background: #1f6feb; }
    .full { background: #9a6700; }
    .meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }
    .meta span {
      padding: 8px;
      border-radius: 12px;
      background: #161b22;
      border: 1px solid rgba(240, 246, 252, 0.08);
      color: #c9d1d9;
      font-size: 12px;
      text-align: center;
    }
    ul { margin: 12px 0 16px; padding-left: 20px; color: #c9d1d9; line-height: 1.65; }
    .button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 13px 16px;
      border-radius: 999px;
      background: #238636;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      border: 0;
      cursor: pointer;
    }
    .button.secondary { background: #1f6feb; }
    .button.dark { background: #30363d; }
    .button.warn { background: #9a6700; }
    code {
      display: block;
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: #161b22;
      border: 1px solid rgba(240, 246, 252, 0.1);
      color: #c9d1d9;
      word-break: break-all;
      white-space: normal;
      font-size: 12px;
      line-height: 1.5;
    }
    footer { text-align: center; margin: 26px 0 6px; color: #8b949e; font-size: 13px; }
    @media (max-width: 780px) {
      .grid { grid-template-columns: 1fr; }
      .meta { grid-template-columns: 1fr; }
      body { padding: 16px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <h1>GrandpaNiu 多版本导入</h1>
      <p>GrandpaNiu 就是默认 Stable；Release 目录里的 Stable 是同一默认版本的独立发布文件。</p>
      <div class="warning">
        不要同时启用多个版本。日常使用 GrandpaNiu（默认 Stable）；测试更多 App 覆盖用 Stable Plus；省电或异常排查用 Lite；Full 只用于查漏拦，不建议长期启用。
      </div>
    </header>

    <section id="profile-grid" class="grid" aria-label="模块版本列表"></section>

    <footer>
      如果一键导入失败，请复制链接，然后到 Shadowrocket 的“配置 -> 模块 -> +”中手动粘贴。覆盖说明来自规则、脚本、MITM 和静态扫描，不等于所有 App 均已真机测试通过。
    </footer>
  </main>

  <script>
    const profiles = [
      {
        key: "root-stable",
        title: "GrandpaNiu",
        tag: "默认 Stable",
        tagClass: "stable",
        buttonClass: "",
        file: "Ronghemokuai.sgmodule",
        mitm: "以报告为准",
        risk: "低",
        defaultUse: "是",
        summary: "默认正式版。它就是 Stable，用于长期日常使用，优先稳定、低误杀、低维护风险。",
        coverage: [
          "已纳入 App 的广告、开屏、弹窗、横幅、信息流、推荐位、活动卡片净化",
          "覆盖音频视频、内容社区、电商购物、本地生活、出行地图、工具办公等方向",
          "Root 默认模块会随 stable 构建结果同步"
        ]
      },
      {
        key: "stable-plus",
        title: "GrandpaNiu Stable Plus",
        tag: "增强测试版",
        tagClass: "plus",
        buttonClass: "secondary",
        file: "Release/Ronghemokuai-stable-plus.sgmodule",
        mitm: "以报告为准",
        risk: "中",
        defaultUse: "否",
        summary: "在默认 Stable 基础上增加常用 App 测试覆盖，不自动进入默认版。",
        coverage: [
          "额外覆盖：爱奇艺、快手、得物、携程、豆瓣、BOSS、WPS、阿里云盘等",
          "适合测试更多 App 的去广告效果",
          "通过测试后才允许单项晋级默认 Stable"
        ]
      },
      {
        key: "lite",
        title: "GrandpaNiu Lite",
        tag: "低耗电版",
        tagClass: "lite",
        buttonClass: "secondary",
        file: "Release/Ronghemokuai-lite.sgmodule",
        mitm: "以报告为准",
        risk: "最低",
        defaultUse: "否",
        summary: "低风险、省电、异常排查版本，只保留最小必要覆盖集合。",
        coverage: [
          "适合排查耗电、发热、登录异常或页面异常",
          "降低 MITM 和脚本覆盖面，便于定位问题",
          "不追求覆盖广度"
        ]
      },
      {
        key: "full",
        title: "GrandpaNiu Full",
        tag: "全量排查版",
        tagClass: "full",
        buttonClass: "warn",
        file: "Release/Ronghemokuai-full.sgmodule",
        mitm: "以报告为准",
        risk: "高",
        defaultUse: "否",
        summary: "全量 MITM 排查版本，只用于查漏拦和定位缺失 hostname。",
        coverage: [
          "包含完整 extended 层",
          "适合定位默认 Stable / Stable Plus 缺失的 hostname",
          "不建议长期启用，不适合支付、登录、验证码、银行场景"
        ]
      }
    ];

    const pagesBase = "https://grandpaniuu.github.io/GrandpaNiu/";

    function escapeHtml(value) {
      return String(value).replace(/[&<>'\"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;"
      }[character]));
    }

    function moduleUrl(profile) {
      return pagesBase + profile.file;
    }

    function importUrl(profile) {
      return "shadowrocket://addmodule?url=" + encodeURIComponent(moduleUrl(profile));
    }

    function renderProfile(profile) {
      const url = moduleUrl(profile);
      const coverageItems = profile.coverage.map(item => `<li>${escapeHtml(item)}</li>`).join("");
      return `
        <article class="card">
          <span class="tag ${profile.tagClass}">${escapeHtml(profile.tag)}</span>
          <h2>${escapeHtml(profile.title)}</h2>
          <p>${escapeHtml(profile.summary)}</p>
          <div class="meta">
            <span>MITM：${escapeHtml(profile.mitm)}</span>
            <span>默认：${escapeHtml(profile.defaultUse)}</span>
            <span>风险：${escapeHtml(profile.risk)}</span>
          </div>
          <ul>${coverageItems}</ul>
          <a class="button ${profile.buttonClass}" href="${importUrl(profile)}">导入 ${escapeHtml(profile.title)}</a>
          <button class="button dark" type="button" data-copy-url="${url}">复制 ${escapeHtml(profile.title)} 链接</button>
          <code>${escapeHtml(url)}</code>
        </article>
      `;
    }

    function copyUrl(url) {
      navigator.clipboard.writeText(url).then(function () {
        alert("模块地址已复制，请到 Shadowrocket 中从链接导入。");
      }).catch(function () {
        prompt("请手动复制模块地址：", url);
      });
    }

    document.getElementById("profile-grid").innerHTML = profiles.map(renderProfile).join("");
    document.addEventListener("click", event => {
      const target = event.target.closest("[data-copy-url]");
      if (target) copyUrl(target.getAttribute("data-copy-url"));
    });
  </script>
</body>
</html>
