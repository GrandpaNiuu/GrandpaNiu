<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导入 Shadowrocket 模块</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #1f6feb 0, #0d1117 45%, #05070a 100%);
      color: #f0f6fc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: rgba(13, 17, 23, 0.88);
      border: 1px solid rgba(240, 246, 252, 0.14);
      border-radius: 24px;
      padding: 34px 24px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    p {
      margin: 12px 0;
      color: #c9d1d9;
      line-height: 1.7;
    }

    .button {
      display: block;
      width: 100%;
      margin: 16px 0;
      padding: 15px 20px;
      border-radius: 999px;
      background: #238636;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      border: 0;
      cursor: pointer;
    }

    .button.secondary {
      background: #1f6feb;
    }

    .button.dark {
      background: #30363d;
    }

    code {
      display: block;
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      background: #161b22;
      border: 1px solid rgba(240, 246, 252, 0.1);
      color: #c9d1d9;
      text-align: left;
      word-break: break-all;
      white-space: normal;
      font-size: 13px;
      line-height: 1.6;
    }

    .tip {
      font-size: 14px;
      color: #8b949e;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>GrandpaNiu</h1>
    <p>Shadowrocket 自用模块合集</p>
    <p>推荐使用 Safari 打开本页面。</p>

    <button class="button" onclick="copyModuleUrl()">
      📋 复制模块地址
    </button>

    <a class="button secondary" href="shadowrocket://">
      🚀 打开 Shadowrocket
    </a>

    <a class="button dark" href="shadowrocket://addmodule?url=https://grandpaniuu.github.io/GrandpaNiu/Ronghemokuai.sgmodule">
      🧪 测试一键导入
    </a>

    <p class="tip">
      如果“一键导入”只会打开小火箭但不会自动安装，请先复制模块地址，再到 Shadowrocket 里从链接导入。
    </p>

    <code id="moduleUrl">https://grandpaniuu.github.io/GrandpaNiu/Ronghemokuai.sgmodule</code>
  </main>

  <script>
    function copyModuleUrl() {
      const url = "https://grandpaniuu.github.io/GrandpaNiu/Ronghemokuai.sgmodule";

      navigator.clipboard.writeText(url).then(function () {
        alert("模块地址已复制，请打开 Shadowrocket 后手动从链接导入。");
      }).catch(function () {
        prompt("请手动复制模块地址：", url);
      });
    }
  </script>
</body>
</html>
