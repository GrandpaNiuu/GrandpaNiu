#!name=GrandpaNiu Spotify Source
#!desc=App-scoped source fragment for Spotify
# source-bootstrap: Release/Modules/spotify.sgmodule
# update-mode: remote-script-level
# remote-script: https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-json.js
# remote-script: https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-proto.js
# note: This module is not overwritten by full upstream module sync; its runtime scripts are pulled remotely by Surge.

[Rule]
DOMAIN-SUFFIX,spotify.com,DIRECT
DOMAIN-SUFFIX,scdn.co,DIRECT
DOMAIN-SUFFIX,spotifycdn.com,DIRECT
DOMAIN-SUFFIX,pscdn.co,DIRECT
DOMAIN,spclient.wg.spotify.com,DIRECT
DOMAIN-SUFFIX,spclient.spotify.com,DIRECT
DOMAIN,ads-img-qc.xhscdn.com,REJECT,pre-matching
DOMAIN,ads-video-al.xhscdn.com,REJECT,pre-matching
DOMAIN,ads-video-qc.xhscdn.com,REJECT,pre-matching

[Header Rewrite]
http-request ^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ header-del if-none-match

[Script]
spotify-json = type=http-request,pattern=^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/,requires-body=0,script-path=https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-json.js,script-update-interval=86400
spotify-proto = type=http-response,pattern=^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$,requires-body=1,binary-body-mode=1,max-size=0,script-path=https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-proto.js,script-update-interval=86400

[MITM]
hostname = %APPEND% spclient.wg.spotify.com,*.spclient.spotify.com
